<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试修复</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .test-result {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .info {
      background-color: #d1ecf1;
      color: #0c5460;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1>修复测试页面</h1>
    
    <div id="test-results"></div>
    
    <div class="mt-4">
      <h3>手动测试</h3>
      <button id="test-play-btn" class="btn btn-primary">
        <i class="fas fa-play"></i> 测试播放按钮
      </button>
      <p class="mt-2">点击按钮测试图标切换功能</p>
    </div>
  </div>

  <script>
    const results = document.getElementById('test-results');
    
    function addResult(message, type) {
      const div = document.createElement('div');
      div.className = 'test-result ' + type;
      div.textContent = message;
      results.appendChild(div);
    }
    
    // 测试1: 检查script.js文件是否存在
    fetch('script.js')
      .then(response => {
        if (response.ok) {
          addResult('✅ script.js 文件存在且可访问', 'success');
        } else {
          addResult('❌ script.js 文件访问失败', 'error');
        }
      })
      .catch(error => {
        addResult('❌ script.js 文件加载失败: ' + error.message, 'error');
      });
    
    // 测试2: 检查video_data.js文件是否存在
    fetch('videos/video_data.js')
      .then(response => {
        if (response.ok) {
          addResult('✅ video_data.js 文件存在且可访问', 'success');
        } else {
          addResult('❌ video_data.js 文件访问失败', 'error');
        }
      })
      .catch(error => {
        addResult('❌ video_data.js 文件加载失败: ' + error.message, 'error');
      });
    
    // 测试3: 检查player_state.js文件是否存在
    fetch('player_state.js')
      .then(response => {
        if (response.ok) {
          addResult('✅ player_state.js 文件存在且可访问', 'success');
        } else {
          addResult('❌ player_state.js 文件访问失败', 'error');
        }
      })
      .catch(error => {
        addResult('❌ player_state.js 文件加载失败: ' + error.message, 'error');
      });
    
    // 测试4: 检查index.html文件是否存在
    fetch('index.html')
      .then(response => {
        if (response.ok) {
          addResult('✅ index.html 文件存在且可访问', 'success');
        } else {
          addResult('❌ index.html 文件访问失败', 'error');
        }
      })
      .catch(error => {
        addResult('❌ index.html 文件加载失败: ' + error.message, 'error');
      });
    
    // 测试播放按钮图标切换
    let isPlaying = false;
    const testPlayBtn = document.getElementById('test-play-btn');
    
    testPlayBtn.addEventListener('click', function() {
      isPlaying = !isPlaying;
      const icon = testPlayBtn.querySelector('i');
      
      if (isPlaying) {
        icon.className = 'fas fa-pause';
        addResult('✅ 播放按钮图标切换为暂停图标', 'success');
      } else {
        icon.className = 'fas fa-play';
        addResult('✅ 播放按钮图标切换为播放图标', 'success');
      }
    });
    
    addResult('📝 测试页面加载完成，请查看上方测试结果', 'info');
  </script>
</body>
</html>
