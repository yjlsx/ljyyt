<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试播放进度恢复</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .test-container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .log-container {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }
    .log-entry {
      margin: 5px 0;
      padding: 5px;
      border-radius: 3px;
    }
    .log-info { background: #d1ecf1; color: #0c5460; }
    .log-success { background: #d4edda; color: #155724; }
    .log-error { background: #f8d7da; color: #721c24; }
    .log-warning { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>
  <div class="container test-container">
    <h1 class="text-center mb-4">🎵 播放进度恢复测试</h1>
    
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">测试步骤</h5>
        <ol class="mb-3">
          <li>点击"开始测试"按钮</li>
          <li>等待音乐开始播放</li>
          <li>等待10秒后，点击"模拟页面跳转"</li>
          <li>观察播放进度是否正确恢复</li>
        </ol>
        
        <div class="d-flex gap-2">
          <button id="start-test" class="btn btn-primary">
            <i class="fas fa-play"></i> 开始测试
          </button>
          <button id="simulate-refresh" class="btn btn-warning" disabled>
            <i class="fas fa-sync"></i> 模拟页面跳转
          </button>
          <button id="clear-storage" class="btn btn-danger">
            <i class="fas fa-trash"></i> 清除存储
          </button>
        </div>
      </div>
    </div>
    
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">当前状态</h5>
        <div class="row">
          <div class="col-md-6">
            <p><strong>播放状态:</strong> <span id="play-status">未播放</span></p>
            <p><strong>当前进度:</strong> <span id="current-progress">0.00</span> 秒</p>
          </div>
          <div class="col-md-6">
            <p><strong>保存的进度:</strong> <span id="saved-progress">无</span></p>
            <p><strong>保存的播放状态:</strong> <span id="saved-play-status">无</span></p>
          </div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">测试日志</h5>
        <div id="log-container" class="log-container"></div>
      </div>
    </div>
  </div>

  <script>
    const logContainer = document.getElementById('log-container');
    const startTestBtn = document.getElementById('start-test');
    const simulateRefreshBtn = document.getElementById('simulate-refresh');
    const clearStorageBtn = document.getElementById('clear-storage');
    const playStatusEl = document.getElementById('play-status');
    const currentProgressEl = document.getElementById('current-progress');
    const savedProgressEl = document.getElementById('saved-progress');
    const savedPlayStatusEl = document.getElementById('saved-play-status');
    
    let audioPlayer = null;
    let progressInterval = null;
    let testStartTime = null;
    
    function addLog(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = 'log-entry log-' + type;
      const time = new Date().toLocaleTimeString();
      entry.textContent = `[${time}] ${message}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }
    
    function updateStatus() {
      if (audioPlayer) {
        playStatusEl.textContent = audioPlayer.paused ? '暂停' : '播放中';
        currentProgressEl.textContent = audioPlayer.currentTime.toFixed(2);
      }
      
      const savedState = localStorage.getItem('playerState');
      if (savedState) {
        try {
          const state = JSON.parse(savedState);
          savedProgressEl.textContent = state.currentTime ? state.currentTime.toFixed(2) + ' 秒' : '0 秒';
          savedPlayStatusEl.textContent = state.isPlaying ? '播放中' : '暂停';
        } catch (e) {
          savedProgressEl.textContent = '解析错误';
          savedPlayStatusEl.textContent = '解析错误';
        }
      } else {
        savedProgressEl.textContent = '无';
        savedPlayStatusEl.textContent = '无';
      }
    }
    
    function savePlayerState(trackId, currentTime, isPlaying, trackData) {
      const playerState = {
        trackId: trackId,
        currentTime: currentTime,
        isPlaying: isPlaying,
        timestamp: Date.now(),
        trackData: trackData || null
      };
      localStorage.setItem('playerState', JSON.stringify(playerState));
      addLog('💾 播放状态已保存: 进度=' + currentTime.toFixed(2) + 's, 播放=' + isPlaying, 'success');
      updateStatus();
    }
    
    startTestBtn.addEventListener('click', function() {
      addLog('🚀 开始测试...', 'info');
      
      // 创建音频播放器
      audioPlayer = new Audio('https://res.wx.qq.com/voice/getvoice?mediaid=MzI2NzU3NDk4Ml8xMDAwMTk1ODI=');
      
      audioPlayer.addEventListener('loadedmetadata', function() {
        addLog('✅ 音频加载完成，时长: ' + audioPlayer.duration.toFixed(2) + '秒', 'success');
      });
      
      audioPlayer.addEventListener('timeupdate', function() {
        updateStatus();
        
        // 每5秒保存一次状态
        if (audioPlayer.currentTime > 0 && Math.floor(audioPlayer.currentTime) % 5 === 0) {
          savePlayerState(1, audioPlayer.currentTime, !audioPlayer.paused, {
            id: 1,
            title: '测试歌曲',
            artist: '测试歌手'
          });
        }
      });
      
      audioPlayer.addEventListener('play', function() {
        addLog('▶️ 开始播放', 'info');
        updateStatus();
      });
      
      audioPlayer.addEventListener('pause', function() {
        addLog('⏸️ 暂停播放', 'warning');
        updateStatus();
      });
      
      audioPlayer.play().then(function() {
        addLog('✅ 播放成功', 'success');
        startTestBtn.disabled = true;
        simulateRefreshBtn.disabled = false;
        testStartTime = Date.now();
        
        // 开始监控进度
        progressInterval = setInterval(updateStatus, 1000);
      }).catch(function(error) {
        addLog('❌ 播放失败: ' + error.message, 'error');
      });
    });
    
    simulateRefreshBtn.addEventListener('click', function() {
      if (!audioPlayer) {
        addLog('❌ 请先开始测试', 'error');
        return;
      }
      
      const currentTime = audioPlayer.currentTime;
      addLog('🔄 模拟页面跳转，当前进度: ' + currentTime.toFixed(2) + '秒', 'warning');
      
      // 停止当前播放
      audioPlayer.pause();
      clearInterval(progressInterval);
      
      // 保存当前状态
      savePlayerState(1, currentTime, true, {
        id: 1,
        title: '测试歌曲',
        artist: '测试歌手'
      });
      
      addLog('⏳ 等待2秒后模拟页面重新加载...', 'info');
      
      // 模拟页面重新加载
      setTimeout(function() {
        addLog('📥 页面重新加载，尝试恢复播放状态...', 'info');
        
        // 恢复播放状态
        const savedState = localStorage.getItem('playerState');
        if (savedState) {
          try {
            const state = JSON.parse(savedState);
            addLog('📋 找到保存的状态: 进度=' + state.currentTime.toFixed(2) + 's, 播放=' + state.isPlaying, 'success');
            
            // 重新创建音频播放器
            audioPlayer = new Audio('https://res.wx.qq.com/voice/getvoice?mediaid=MzI2NzU3NDk4Ml8xMDAwMTk1ODI=');
            
            audioPlayer.addEventListener('loadedmetadata', function onMetadataLoaded() {
              addLog('✅ 音频重新加载完成', 'success');
              
              // 恢复播放位置
              if (state.currentTime > 0) {
                audioPlayer.currentTime = state.currentTime;
                addLog('📍 恢复播放位置: ' + state.currentTime.toFixed(2) + '秒', 'success');
              }
              
              // 如果之前在播放，则继续播放
              if (state.isPlaying) {
                audioPlayer.play().then(function() {
                  addLog('▶️ 继续播放', 'success');
                  updateStatus();
                  
                  // 验证恢复的进度
                  setTimeout(function() {
                    const recoveredTime = audioPlayer.currentTime;
                    const diff = Math.abs(recoveredTime - state.currentTime);
                    
                    if (diff < 1) {
                      addLog('✅ 播放进度恢复成功！误差: ' + diff.toFixed(2) + '秒', 'success');
                    } else {
                      addLog('⚠️ 播放进度恢复有偏差，误差: ' + diff.toFixed(2) + '秒', 'warning');
                    }
                    
                    // 重新开始监控
                    progressInterval = setInterval(updateStatus, 1000);
                  }, 1000);
                }).catch(function(error) {
                  addLog('❌ 继续播放失败: ' + error.message, 'error');
                });
              }
              
              audioPlayer.removeEventListener('loadedmetadata', onMetadataLoaded);
            });
            
            audioPlayer.addEventListener('timeupdate', function() {
              updateStatus();
            });
            
            audioPlayer.load();
            
          } catch (e) {
            addLog('❌ 解析保存的状态失败: ' + e.message, 'error');
          }
        } else {
          addLog('❌ 未找到保存的播放状态', 'error');
        }
      }, 2000);
    });
    
    clearStorageBtn.addEventListener('click', function() {
      localStorage.removeItem('playerState');
      addLog('🗑️ 已清除存储的播放状态', 'warning');
      updateStatus();
      
      if (audioPlayer) {
        audioPlayer.pause();
        clearInterval(progressInterval);
        audioPlayer = null;
        startTestBtn.disabled = false;
        simulateRefreshBtn.disabled = true;
      }
    });
    
    // 初始化状态显示
    updateStatus();
    addLog('📝 测试页面加载完成', 'info');
  </script>
</body>
</html>
