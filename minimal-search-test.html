<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最小化搜索测试</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      padding: 20px;
      background: #f8f9fa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-4">最小化搜索测试</h1>
    
    <div class="alert alert-info">
      <strong>测试目的：</strong>验证搜索页面的核心功能
    </div>
    
    <div class="card mb-4">
      <div class="card-header">
        <h5>URL参数测试</h5>
      </div>
      <div class="card-body">
        <p><strong>当前URL：</strong><span id="current-url"></span></p>
        <p><strong>URL.search：</strong><span id="url-search"></span></p>
        <p><strong>搜索关键词：</strong><span id="search-query" class="badge bg-primary">-</span></p>
      </div>
    </div>
    
    <div class="card mb-4">
      <div class="card-header">
        <h5>搜索测试</h5>
      </div>
      <div class="card-body">
        <div class="input-group mb-3">
          <input type="text" id="search-input" class="form-control" placeholder="输入搜索关键词" value="纳西">
          <button class="btn btn-primary" id="search-btn">搜索</button>
        </div>
        <div id="search-status"></div>
        <div id="search-results"></div>
      </div>
    </div>
  </div>

  <script src="script_fixed.js"></script>
  <script src="videos/video_data.js"></script>
  
  <script>
    console.log('🔍 最小化搜索测试页面加载');
    
    // 显示URL信息
    document.getElementById('current-url').textContent = window.location.href;
    document.getElementById('url-search').textContent = window.location.search;
    
    // 获取URL参数
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }
    
    // 格式化时间
    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '00:00';
      var min = Math.floor(seconds / 60);
      var sec = Math.floor(seconds % 60);
      return (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec;
    }

    // 搜索函数
    function search(query) {
      query = query.toLowerCase().trim();
      
      if (!query) {
        return {
          music: [],
          video: []
        };
      }
      
      var results = {
        music: [],
        video: []
      };
      
      // 搜索音乐
      if (typeof musicData !== 'undefined') {
        results.music = musicData.filter(function(track) {
          return track.title.toLowerCase().indexOf(query) !== -1 || 
                 track.artist.toLowerCase().indexOf(query) !== -1 ||
                 track.album.toLowerCase().indexOf(query) !== -1;
        });
      }
      
      // 搜索视频
      if (typeof videoData !== 'undefined') {
        results.video = videoData.filter(function(video) {
          return video.title.toLowerCase().indexOf(query) !== -1 || 
                 video.artist.toLowerCase().indexOf(query) !== -1 ||
                 video.album.toLowerCase().indexOf(query) !== -1;
        });
      }
      
      return results;
    }

    // 执行搜索
    function performSearch(query) {
      console.log('🔍 执行搜索:', query);
      var statusDiv = document.getElementById('search-status');
      var resultsDiv = document.getElementById('search-results');
      
      statusDiv.innerHTML = '<p class="text-info">正在搜索...</p>';
      resultsDiv.innerHTML = '';
      
      setTimeout(function() {
        try {
          var results = search(query);
          console.log('✅ 搜索完成: 音乐', results.music.length, '个, 视频', results.video.length, '个');
          
          statusDiv.innerHTML = '<p class="text-success">搜索完成！找到 ' + (results.music.length + results.video.length) + ' 个结果</p>';
          
          if (results.music.length > 0) {
            var html = '<h6>音乐结果 (' + results.music.length + '个)</h6><div class="row">';
            
            results.music.slice(0, 3).forEach(function(track, index) {
              html += `
                <div class="col-md-6 col-lg-4 mb-3">
                  <div class="card music-card" data-id="${track.id}">
                    <div class="card-body d-flex align-items-center">
                      <img src="${track.cover}" alt="${track.title}" class="album-cover me-3">
                      <div class="flex-grow-1">
                        <h6 class="card-title mb-1">${track.title}</h6>
                        <p class="card-text text-muted mb-0">${track.artist} <span class="ms-4">${formatTime(track.duration)}</span></p>
                      </div>
                      <i class="fas fa-music text-primary ms-2" style="font-size: 1.2rem;"></i>
                    </div>
                  </div>
                </div>
              `;
            });
            
            html += '</div>';
            resultsDiv.innerHTML = html;
            
            // 添加点击事件
            document.querySelectorAll('.music-card').forEach(function(card, index) {
              card.addEventListener('click', function() {
                console.log('🖱️ 点击了音乐卡片:', index);
                alert('点击了: ' + results.music[index].title);
              });
              card.style.cursor = 'pointer';
            });
          } else {
            resultsDiv.innerHTML = '<p class="text-muted">未找到相关音乐</p>';
          }
        } catch (error) {
          console.error('❌ 搜索失败:', error);
          statusDiv.innerHTML = '<p class="text-danger">搜索失败: ' + error.message + '</p>';
        }
      }, 100);
    }

    // 绑定事件
    document.getElementById('search-btn').addEventListener('click', function() {
      var query = document.getElementById('search-input').value;
      performSearch(query);
    });

    // 页面加载后自动搜索
    window.onload = function() {
      console.log('✅ 页面加载完成');
      
      var query = getUrlParameter('q');
      console.log('📝 URL参数中的搜索关键词:', query);
      
      if (query) {
        document.getElementById('search-query').textContent = query;
        document.getElementById('search-input').value = query;
        performSearch(query);
      } else {
        document.getElementById('search-query').textContent = '无';
      }
    };
  </script>
</body>
</html>
