<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .status {
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      border-left: 4px solid #ccc;
    }
    .success {
      background-color: #d4edda;
      border-left-color: #28a745;
      color: #155724;
    }
    .error {
      background-color: #f8787da;
      border-left-color: #dc3545;
      color: #721c24;
    }
    .info {
      background-color: #d1ecf1;
      border-left-color: #17a2b8;
      color: #0c5460;
    }
    .warning {
      background-color: #fff3cd;
      border-left-color: #ffc107;
      color: #856404;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #results {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🔍 简单测试页面</h1>
  
  <div id="status" class="status info">
    <strong>状态：</strong> 等待测试...
  </div>
  
  <div>
    <button onclick="testAll()">开始测试</button>
    <button onclick="clearResults()">清除结果</button>
  </div>
  
  <div id="results"></div>

  <script>
    const statusDiv = document.getElementById('status');
    const resultsDiv = document.getElementById('results');
    
    function updateStatus(message, type) {
      statusDiv.className = 'status ' + type;
      statusDiv.innerHTML = '<strong>状态：</strong> ' + message;
    }
    
    function addResult(message, type) {
      const div = document.createElement('div');
      div.className = 'status ' + type;
      div.innerHTML = message;
      resultsDiv.appendChild(div);
    }
    
    function clearResults() {
      resultsDiv.innerHTML = '';
    }
    
    function testAll() {
      clearResults();
      updateStatus('正在测试...', 'info');
      
      let testsPassed = 0;
      let testsFailed = 0;
      
      // 测试1: 检查 script.js 是否加载
      addResult('<strong>测试1: 检查 script.js 加载</strong>', 'info');
      
      fetch('script.js')
        .then(response => {
          if (response.ok) {
            addResult('✅ script.js 加载成功', 'success');
            testsPassed++;
            
            // 测试2: 检查文件内容
            return response.text();
          } else {
            throw new Error('HTTP ' + response.status);
          }
        })
        .then(content => {
          addResult('<strong>测试2: 检查 script.js 内容</strong>', 'info');
          
          // 检查关键内容
          const checks = [
            { name: 'musicData 定义', pattern: 'const musicData' },
            { name: 'renderMusicList 函数', pattern: 'function renderMusicList' },
            { name: 'renderVideoList 函数', pattern: 'function renderVideoList' },
            { name: 'playMusic 函数', pattern: 'function playMusic' },
            { name: 'pauseMusic 函数', pattern: 'function pauseMusic' },
            { name: 'updatePlayButton 函数', pattern: 'function updatePlayButton' },
            { name: 'isPlaying 更新', pattern: 'isPlaying = true' },
            { name: 'videoData 引用', pattern: 'videoData' }
          ];
          
          let contentChecksPassed = 0;
          checks.forEach(check => {
            if (check.pattern in content || content.includes(check.pattern)) {
              addResult('✅ ' + check.name, 'success');
              contentChecksPassed++;
            } else {
              addResult('❌ ' + check.name, 'error');
              testsFailed++;
            }
          });
          
          if (contentChecksPassed === checks.length) {
            testsPassed++;
            addResult('✅ 所有内容检查通过', 'success');
          } else {
            addResult('❌ 部分内容检查失败', 'error');
          }
          
          // 测试3: 检查 video_data.js
          addResult('<strong>测试3: 检查 video_data.js</strong>', 'info');
          
          return fetch('videos/video_data.js');
        })
        .then(response => {
          if (response.ok) {
            addResult('✅ video_data.js 加载成功', 'success');
            testsPassed++;
            return response.text();
          } else {
            throw new Error('HTTP ' + response.status);
          }
        })
        .then(content => {
          if ('const videoData' in content || content.includes('const videoData')) {
            addResult('✅ videoData 定义存在', 'success');
            testsPassed++;
          } else {
            addResult('❌ videoData 定义不存在', 'error');
            testsFailed++;
          }
          
          // 测试4: 检查 player_state.js
          addResult('<strong>测试4: 检查 player_state.js</strong>', 'info');
          
          return fetch('player_state.js');
        })
        .then(response => {
          if (response.ok) {
            addResult('✅ player_state.js 加载成功', 'success');
            testsPassed++;
            return response.text();
          } else {
            throw new Error('HTTP ' + response.status);
          }
        })
        .then(content => {
          const checks = [
            { name: 'savePlayerState 函数', pattern: 'function savePlayerState' },
            { name: 'restorePlayerState 函数', pattern: 'function restorePlayerState' }
          ];
          
          let playerStateChecksPassed = 0;
          checks.forEach(check => {
            if (check.pattern in content || content.includes(check.pattern)) {
              addResult('✅ ' + check.name, 'success');
              playerStateChecksPassed++;
            } else {
              addResult('❌ ' + check.name, 'error');
              testsFailed++;
            }
          });
          
          if (playerStateChecksPassed === checks.length) {
            testsPassed++;
            addResult('✅ player_state.js 检查通过', 'success');
          } else {
            addResult('❌ player_state.js 检查失败', 'error');
          }
          
          // 最终结果
          addResult('<strong>测试完成</strong>', 'info');
          addResult('通过: ' + testsPassed + '，失败: ' + testsFailed, 
                   testsFailed === 0 ? 'success' : 'warning');
          
          if (testsFailed === 0) {
            updateStatus('✅ 所有测试通过！', 'success');
          } else {
            updateStatus('⚠️ 部分测试失败', 'warning');
          }
        })
        .catch(error => {
          addResult('❌ 测试失败: ' + error.message, 'error');
          updateStatus('❌ 测试失败', 'error');
        });
    }
    
    // 页面加载时显示提示
    window.addEventListener('load', function() {
      updateStatus('📝 测试页面已加载，点击"开始测试"按钮', 'info');
    });
  </script>
</body>
</html>
