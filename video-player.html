<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>视频播放 - 丽江音悦台</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="scroll_to_top.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background: url('./images/yyt.png') no-referrer center center fixed !important;
      background-size: cover !important;
      padding-top: 70px;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.3);
      z-index: -1;
    }
    
    /* 导航栏样式完全同步首页 */
    .navbar { background-color: #0d6efd !important; }
    .navbar-brand { display: flex !important; align-items: center !important; gap: 10px !important; }
    .brand-name { font-size: 1.2rem !important; font-weight: bold !important; color: white !important; line-height: 1.2; }
    .brand-slogan { font-size: 0.7rem !important; color: rgba(255, 255, 255, 0.8) !important; white-space: nowrap; }

    /* 布局容器 */
    .player-main-layout {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      justify-content: center;
      padding: 20px;
      flex-wrap: wrap; /* 手机端自动换行 */
    }
    
    /* 左侧播放器宽度 */
    .player-left-col { width: 900px; flex: 0 0 auto; max-width: 100%; }
    /* 右侧列表宽度 */
    .player-right-col { width: 400px; flex: 0 0 auto; max-width: 100%; }

    /* 白色外框：PC端留白 30px */
    .video-wrapper {
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px !important; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    
    /* 黑色视频框：锁定 16:9 */
    .video-container {
      width: 100% !important;
      background: #000 !important;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      padding-top: 56.25%; /* 16:9 比例 */
      margin-bottom: 20px;
    }
    .video-container video, .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    /* 视频信息区 */
    .video-info h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 15px; color: #333; }
    .meta-row { display: flex; gap: 20px; margin-bottom: 10px; flex-wrap: wrap; }
    .meta-item { display: flex; align-items: center; color: #666; font-size: 0.95rem; }
    .meta-item i { color: #0d6efd; margin-right: 8px; width: 20px; }
    .description { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; color: #555; line-height: 1.6; }

    /* 右侧列表 */
    .related-videos {
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .video-card { cursor: pointer; transition: transform 0.2s; background: rgba(255,255,255,0.5); border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    .video-card:hover { transform: scale(1.02); }

    /* 分页 */
    .pagination-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .pagination-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .pagination-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* ====================================================== */
    /* 手机端 (Responsive) 深度适配核心代码 */
    /* ====================================================== */
    @media (max-width: 991.98px) {
      .player-main-layout { padding: 10px; }
      
      /* 手机端左右留白缩小到 15px，防止视频太小 */
      .video-wrapper { padding: 15px !important; }
      
      .player-left-col, .player-right-col { width: 100%; }
      
      /* 导航栏标语缩短防止溢出 */
      .brand-slogan { max-width: 180px; overflow: hidden; text-overflow: ellipsis; font-size: 0.6rem !important; }
      
      /* 手机端视频列表一行一个，看得更清楚 */
      .col-6-mobile-fix { width: 100% !important; }
    }
    
    @media (max-width: 575.98px) {
      .brand-name { font-size: 1rem !important; }
      .brand-slogan { display: none; } /* 极窄屏隐藏小标语 */
      .video-info h2 { font-size: 1.1rem; }
      .meta-item { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="./images/avatar.jpg" width="40" height="40" class="rounded-circle me-2">
        <div class="d-flex flex-column">
          <span class="brand-name">丽江音悦台</span>
          <span class="brand-slogan">传承纳西文化，分享民族音乐之美</span>
        </div>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#about">关于我们</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#contact">联系我们</a></li>
        </ul>
        <form class="d-flex mt-2 mt-lg-0" id="search-form" action="search.html" method="GET">
          <input class="form-control me-2" type="search" name="q" placeholder="搜索音乐..." aria-label="搜索">
          <button class="btn btn-outline-light" type="submit"><i class="fas fa-search"></i></button>
        </form>
      </div>
    </div>
  </nav>

  <div class="player-main-layout">
    <!-- 左侧区域 -->
    <div class="player-left-col">
      <div class="video-wrapper">
        <div class="video-container" id="videoContainer"></div>
        <div class="video-info">
          <h2 id="videoTitle">加载中...</h2>
          <div class="meta-row">
            <div class="meta-item"><i class="fas fa-user"></i><span id="videoArtist">-</span></div>
            <div class="meta-item"><i class="fas fa-compact-disc"></i><span id="videoAlbum">-</span></div>
          </div>
          <div class="description" id="videoDescription"></div>
        </div>
      </div>
    </div>

    <!-- 右侧区域 -->
    <div class="player-right-col">
      <div class="related-videos">
        <h3 class="mb-3" style="font-size: 1.1rem; border-left: 4px solid #0d6efd; padding-left: 10px;">📺 视频列表</h3>
        <div class="pagination-controls" id="paginationControls"></div>
        <div class="row" id="relatedVideos"></div>
      </div>
    </div>
  </div>

  <script src="videos/video_data.js"></script>
  <script>
    var currentPage = 0;
    var videosPerPage = 8;
    var allRelatedVideos = [];

    function getUrlParameter(name) {
      var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
      return results ? decodeURIComponent(results[1]) : null;
    }

    function renderPlayer(video) {
      const container = document.getElementById('videoContainer');
      if(video.src.includes('bilibili.com')) {
        let bvid = video.src.match(/bvid=([a-zA-Z0-9]+)/)[1];
        container.innerHTML = `<iframe src="//player.bilibili.com/player.html?bvid=${bvid}&autoplay=1" frameborder="0" allowfullscreen></iframe>`;
      } else {
        container.innerHTML = `<video src="${video.src}" controls autoplay playsinline style="width:100%; height:100%;"></video>`;
      }
      document.getElementById('videoTitle').innerText = video.title;
      document.getElementById('videoArtist').innerText = video.artist;
      document.getElementById('videoAlbum').innerText = video.album || '默认专辑';
      document.getElementById('videoDescription').innerText = video.description || '暂无描述';
      document.title = video.title + " - 丽江音悦台";
    }

    function renderList() {
      const list = document.getElementById('relatedVideos');
      list.innerHTML = '';
      let start = currentPage * videosPerPage;
      let end = start + videosPerPage;
      let currentVideos = allRelatedVideos.slice(start, end);

      currentVideos.forEach(v => {
        // 修改：点击视频时，将当前页码通过 URL 参数传递，实现翻页记忆
        list.innerHTML += `<div class="col-12 col-md-6 mb-3">
          <div class="video-card h-100" onclick="location.href='video-player.html?id=${v.id}&page=${currentPage}'">
            <img src="${v.cover}" class="w-100" style="height:110px; object-fit:cover;">
            <div class="p-2 small">
              <div class="text-truncate fw-bold">${v.title}</div>
              <div class="text-muted text-truncate">${v.artist}</div>
            </div>
          </div>
        </div>`;
      });
      renderPagination();
    }

    function renderPagination() {
      const controls = document.getElementById('paginationControls');
      let totalPages = Math.ceil(allRelatedVideos.length / videosPerPage);
      controls.innerHTML = `
        <button class="pagination-btn" ${currentPage==0?'disabled':''} onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
        <span class="small text-muted">${currentPage+1} / ${totalPages}</span>
        <button class="pagination-btn" ${currentPage>=totalPages-1?'disabled':''} onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
      `;
    }

    function changePage(dir) {
      currentPage += dir;
      renderList();
    }

    window.onload = function() {
      let id = getUrlParameter('id');
      // 新增：从 URL 获取保存的页码参数
      let savedPage = getUrlParameter('page');
      if (savedPage !== null) {
        currentPage = parseInt(savedPage);
      }
      
      let video = videoData.find(v => v.id == id);
      if(video) {
        renderPlayer(video);
        allRelatedVideos = videoData.filter(v => v.id != id);
        renderList();
      }
    }
  </script>
</body>
</html>
