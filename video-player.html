<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>视频播放 - 丽江音悦台</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style_mobile.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding-top: 56px;
      padding-bottom: 80px;
      min-height: 100vh;
    }
    
    .video-wrapper {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
      padding: 20px;
    }
    
    .video-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: #000;
      position: relative;
      padding-top: 55%; /* 接近16:9的比例 */
      border-radius: 10px;
      overflow: hidden;
    }
    
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .video-info {
      padding: 20px;
    }
    
    .video-info h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: #333;
    }
    
    .video-info .meta-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      color: #666;
      font-size: 0.95rem;
    }
    
    .video-info .meta-item i {
      width: 24px;
      color: #667eea;
      margin-right: 10px;
    }
    
    .video-info .meta-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 10px;
      gap: 20px;
    }
    
    .video-info .meta-row .meta-item {
      margin-bottom: 0;
      flex: 0 0 auto;
    }
    
    .video-info .description {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      color: #555;
      line-height: 1.6;
    }
    
    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 3rem;
      z-index: 10;
    }
    
    .error-message {
      text-align: center;
      padding: 60px 20px;
      color: #333;
    }
    
    .error-message i {
      font-size: 4rem;
      color: #dc3545;
      margin-bottom: 20px;
    }
    
    .related-videos {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .related-videos h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #333;
    }
    
    .pagination-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 10px;
      position: relative;
    }
    
    .pagination-info {
      font-size: 0.9rem;
      color: #666;
      font-weight: 600;
      background: white;
      padding: 5px 15px;
      border-radius: 15px;
      z-index: 1;
    }
    
    .pagination-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .pagination-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .pagination-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    /* 移动端优化 */
    @media (max-width: 575.98px) {
      body {
        padding-top: 56px;
        padding-bottom: 20px;
      }
      
      .video-wrapper {
        border-radius: 12px;
        margin-bottom: 15px;
        max-width: 100%;
        padding: 15px;
      }
      
      .video-container {
        padding-top: 56.25%; /* 移动端恢复16:9比例 */
        max-width: 100%;
      }
      
      .video-info {
        padding: 15px;
      }
      
      .video-info h2 {
        font-size: 1.1rem;
        margin-bottom: 12px;
      }
      
      .video-info .meta-item {
        font-size: 0.85rem;
        margin-bottom: 6px;
      }
      
      .related-videos {
        border-radius: 12px;
        padding: 15px;
        max-width: 100%;
      }
      
      .related-videos h3 {
        font-size: 1.1rem;
        margin-bottom: 15px;
      }
      
      .pagination-btn {
        padding: 8px 16px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="./images/avatar.jpg" alt="丽江音悦台" width="40" height="40" class="rounded-circle me-2">
        丽江音悦台
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">首页</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#about">关于我们</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#contact">联系我们</a>
          </li>
        </ul>
        <!-- 搜索栏 -->
        <form class="d-flex" id="search-form">
          <input class="form-control me-2" type="search" id="search-input" placeholder="搜索音乐..." aria-label="搜索">
          <button class="btn btn-outline-light" type="submit">
            <i class="fas fa-search"></i>
          </button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <!-- 视频播放区域 -->
    <div class="video-wrapper">
      <div class="video-container" id="videoContainer">
        <div class="loading-spinner">
          <i class="fas fa-spinner fa-spin"></i>
        </div>
      </div>
      
      <!-- 视频信息 -->
      <div class="video-info" id="videoInfo" style="display: none;">
        <h2 id="videoTitle">加载中...</h2>
        <div class="meta-row">
          <div class="meta-item">
            <i class="fas fa-user"></i>
            <span id="videoArtist">-</span>
          </div>
          <div class="meta-item">
            <i class="fas fa-compact-disc"></i>
            <span id="videoAlbum">-</span>
          </div>
        </div>
        <div class="description" id="videoDescription"></div>
      </div>
    </div>

    <!-- 相关视频 -->
    <div class="related-videos" id="relatedVideosContainer">
      <div class="row" id="relatedVideos">
        <!-- 相关视频列表 -->
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- 视频数据 -->
  <script src="videos/video_data.js"></script>
  
  <script>
    // 全局变量
    var currentPage = 0;
    var videosPerPage = 8;
    var currentVideoId = null;
    var allRelatedVideos = [];
    
    // 获取URL参数
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // 查找视频
    function findVideoById(id) {
      if (typeof videoData === 'undefined') {
        console.error('videoData 未定义');
        return null;
      }
      
      return videoData.find(function(video) {
        return video.id == id;
      });
    }

    // 渲染视频播放器
    function renderVideoPlayer(video) {
      var container = document.getElementById('videoContainer');
      var info = document.getElementById('videoInfo');
      
      if (!video) {
        container.innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>视频未找到</h3>
            <p>请返回重新选择视频</p>
            <a href="index.html" class="btn btn-primary mt-3">返回首页</a>
          </div>
        `;
        return;
      }

      // 检查是否是Bilibili视频
      var isBilibiliVideo = video.src.includes('bilibili.com') || video.src.includes('bvid=');
      
      if (isBilibiliVideo) {
        console.log('📺 检测到Bilibili视频，使用嵌入播放器');
        
        // 提取Bilibili视频ID
        var bvid = '';
        if (video.src.includes('bvid=')) {
          var bvidMatch = video.src.match(/bvid=([a-zA-Z0-9]+)/);
          if (bvidMatch) {
            bvid = bvidMatch[1];
          }
        } else if (video.src.includes('/video/')) {
          var videoIdMatch = video.src.match(/\/video\/([a-zA-Z0-9]+)/);
          if (videoIdMatch) {
            bvid = videoIdMatch[1];
          }
        }
        
        console.log('📹 Bilibili视频ID:', bvid);
        
        // 创建Bilibili嵌入播放器
        var iframe = document.createElement('iframe');
        iframe.width = '100%';
        iframe.height = '100%';
        iframe.style.minHeight = '450px';
        iframe.src = '//player.bilibili.com/player.html?bvid=' + bvid + '&autoplay=1';
        iframe.frameBorder = '0';
        iframe.scrolling = 'no';
        iframe.allowFullscreen = true;
        iframe.style.borderRadius = '10px';
        
        container.innerHTML = '';
        container.appendChild(iframe);
        
        console.log('✅ Bilibili嵌入播放器已创建');
      } else {
        console.log('🎬 普通视频，使用HTML5视频播放器');
        
        // 创建视频元素
        var videoElement = document.createElement('video');
        videoElement.controls = true;
        
        // 检查URL参数是否包含autoplay=true
        var autoplayParam = getUrlParameter('autoplay');
        videoElement.autoplay = (autoplayParam === 'true');
        videoElement.playsInline = true;
        
        // 添加视频源
        var source = document.createElement('source');
        source.src = video.src;
        source.type = 'video/mp4';
        videoElement.appendChild(source);
        
        // 错误处理
        videoElement.addEventListener('error', function() {
          console.error('视频加载失败:', video.src);
          container.innerHTML = `
            <div class="error-message">
              <i class="fas fa-exclamation-circle"></i>
              <h3>视频加载失败</h3>
              <p>视频源可能已失效或网络连接有问题</p>
              <p class="small text-muted">视频URL: ${video.src.substring(0, 50)}...</p>
              <a href="index.html" class="btn btn-primary mt-3">返回首页</a>
            </div>
          `;
        });
        
        // 加载成功
        videoElement.addEventListener('loadeddata', function() {
          console.log('视频加载成功');
        });
        
        container.innerHTML = '';
        container.appendChild(videoElement);
      }
      
      // 更新视频信息
      document.getElementById('videoTitle').textContent = video.title;
      document.getElementById('videoArtist').textContent = video.artist;
      document.getElementById('videoAlbum').textContent = video.album;
      document.getElementById('videoDescription').textContent = video.description || '暂无描述';
      info.style.display = 'block';
      
      // 更新页面标题
      document.title = video.title + ' - 丽江音悦台';
    }

    // 渲染相关视频
    function renderRelatedVideos(currentVideo) {
      var container = document.getElementById('relatedVideos');
      var containerWrapper = document.getElementById('relatedVideosContainer');
      
      if (typeof videoData === 'undefined') {
        return;
      }
      
      // 过滤掉当前视频
      allRelatedVideos = videoData.filter(function(v) { return v.id !== currentVideo.id; });
      
      // 只在第一次调用时重置到第一页\n      if (typeof currentPage === 'undefined' || currentPage === null) {\n        currentPage = 0;\n        console.log('📄 初始化分页，重置到第一页');\n      } else {\n        console.log('📄 保持当前页码:', currentPage);\n      }
      
      // 清空容器
      container.innerHTML = '';
      
      // 检查是否已有标题，如果没有则添加
      var existingTitle = containerWrapper.querySelector('h3');
      if (!existingTitle) {
        var title = document.createElement('h3');
        title.textContent = '📺 相关视频';
        containerWrapper.insertBefore(title, container);
      }
      
      // 添加分页控制
      renderPaginationControls();
      
      // 渲染当前页的视频
      renderCurrentPage();
    }
    
    // 渲染分页控制
    function renderPaginationControls() {
      var container = document.getElementById('relatedVideos');
      var containerWrapper = document.getElementById('relatedVideosContainer');
      
      // 移除旧的分页控制
      var oldControls = containerWrapper.querySelector('.pagination-controls');
      if (oldControls) {
        oldControls.remove();
      }
      
      // 计算总页数
      var totalPages = Math.ceil(allRelatedVideos.length / videosPerPage);
      
      // 创建分页控制
      var controlsDiv = document.createElement('div');
      controlsDiv.className = 'pagination-controls';
      
      // 上一页按钮
      var prevBtn = document.createElement('button');
      prevBtn.className = 'pagination-btn';
      prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
      prevBtn.disabled = currentPage === 0;
      prevBtn.onclick = function() {
        if (currentPage > 0) {
          currentPage--;
          renderCurrentPage();
          renderPaginationControls();
        }
      };
      
      // 页码信息
      var pageInfo = document.createElement('span');
      pageInfo.className = 'pagination-info';
      pageInfo.textContent = (currentPage + 1) + ' / ' + totalPages;
      
      // 下一页按钮
      var nextBtn = document.createElement('button');
      nextBtn.className = 'pagination-btn';
      nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
      nextBtn.disabled = currentPage >= totalPages - 1;
      nextBtn.onclick = function() {
        if (currentPage < totalPages - 1) {
          currentPage++;
          renderCurrentPage();
          renderPaginationControls();
        }
      };
      
      controlsDiv.appendChild(prevBtn);
      controlsDiv.appendChild(pageInfo);
      controlsDiv.appendChild(nextBtn);
      
      // 插入到容器前面
      containerWrapper.insertBefore(controlsDiv, container);
    }
    
    // 渲染当前页的视频
    function renderCurrentPage() {
      var container = document.getElementById('relatedVideos');
      
      // 清空容器
      container.innerHTML = '';
      
      // 计算当前页的视频范围
      var startIndex = currentPage * videosPerPage;
      var endIndex = Math.min(startIndex + videosPerPage, allRelatedVideos.length);
      var currentVideos = allRelatedVideos.slice(startIndex, endIndex);
      
      // 渲染视频卡片
      currentVideos.forEach(function(video) {
        var col = document.createElement('div');
        col.className = 'col-6 col-md-4 col-lg-3 mb-3';
        
        col.innerHTML = `
          <div class="card video-card" onclick="playVideo(${video.id})">
            <img src="${video.cover}" class="card-img-top" alt="${video.title}" style="height: 120px; object-fit: cover;">
            <div class="card-body p-2">
              <h6 class="card-title mb-1" style="font-size: 0.85rem;">${video.title}</h6>
              <p class="card-text mb-0" style="font-size: 0.75rem;">${video.artist}</p>
            </div>
          </div>
        `;
        
        container.appendChild(col);
      });
    }

    // 播放指定视频
    function playVideo(videoId) {
      var video = findVideoById(videoId);
      if (video) {
        currentVideoId = videoId;
        renderVideoPlayer(video);
        renderRelatedVideos(video);
        // 滚动到顶部
        window.scrollTo(0, 0);
      }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
      console.log('🎬 视频播放器页面加载');
      
      var videoId = getUrlParameter('id');
      console.log('📹 视频ID:', videoId);
      
      if (!videoId) {
        console.error('❌ 未提供视频ID');
        document.getElementById('videoContainer').innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>未指定视频</h3>
            <p>请从视频列表选择要播放的视频</p>
            <a href="index.html" class="btn btn-primary mt-3">返回首页</a>
          </div>
        `;
        return;
      }
      
      // 等待视频数据加载
      var checkVideoData = setInterval(function() {
        if (typeof videoData !== 'undefined') {
          clearInterval(checkVideoData);
          console.log('✅ videoData 已加载，视频数量:', videoData.length);
          
          var video = findVideoById(videoId);
          if (video) {
            console.log('✅ 找到视频:', video.title);
            currentVideoId = videoId;
            renderVideoPlayer(video);
            renderRelatedVideos(video);
          } else {
            console.error('❌ 未找到ID为', videoId, '的视频');
            renderVideoPlayer(null);
          }
        }
      }, 100);
      
      // 超时处理
      setTimeout(function() {
        if (typeof videoData === 'undefined') {
          clearInterval(checkVideoData);
          console.error('❌ videoData 加载超时');
          document.getElementById('videoContainer').innerHTML = `
            <div class="error-message">
              <i class="fas fa-exclamation-triangle"></i>
              <h3>数据加载失败</h3>
              <p>视频数据加载超时，请检查网络连接</p>
              <button class="btn btn-primary mt-3" onclick="location.reload()">重新加载</button>
            </div>
          `;
        }
      }, 5000);
    });
  </script>
</body>
</html>
