  <script>
    // 全局变量
    var currentPage = 0;
    var videosPerPage = 8;
    var currentVideoId = null;
    var allRelatedVideos = [];
    
    // 获取URL参数
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // 查找视频
    function findVideoById(id) {
      if (typeof videoData === 'undefined') {
        console.error('videoData 未定义');
        return null;
      }
      
      return videoData.find(function(video) {
        return video.id == id;
      });
    }

    // 渲染视频播放器
    function renderVideoPlayer(video) {
      var container = document.getElementById('videoContainer');
      var info = document.getElementById('videoInfo');
      
      if (!video) {
        container.innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>视频未找到</h3>
            <p>请返回重新选择视频</p>
            <a href="index.html" class="btn btn-primary mt-3">返回首页</a>
          </div>
        `;
        return;
      }

      // 检查是否是Bilibili视频
      var isBilibiliVideo = video.src.includes('bilibili.com') || video.src.includes('bvid=');
      
      if (isBilibiliVideo) {
        console.log('📺 检测到Bilibili视频，使用嵌入播放器');
        
        // 提取Bilibili视频ID
        var bvid = '';
        if (video.src.includes('bvid=')) {
          var bvidMatch = video.src.match(/bvid=([a-zA-Z0-9]+)/);
          if (bvidMatch) {
            bvid = bvidMatch[1];
          }
        } else if (video.src.includes('/video/')) {
          var videoIdMatch = video.src.match(/\/video\/([a-zA-Z0-9]+)/);
          if (videoIdMatch) {
            bvid = videoIdMatch[1];
          }
        }
        
        console.log('📹 Bilibili视频ID:', bvid);
        
        // 创建Bilibili嵌入播放器
        var iframe = document.createElement('iframe');
        iframe.width = '100%';
        iframe.height = '100%';
        iframe.style.minHeight = '450px';
        iframe.src = '//player.bilibili.com/player.html?bvid=' + bvid + '&autoplay=1';
        iframe.frameBorder = '0';
        iframe.scrolling = 'no';
        iframe.allowFullscreen = true;
        iframe.style.borderRadius = '10px';
        
        container.innerHTML = '';
        container.appendChild(iframe);
        
        console.log('✅ Bilibili嵌入播放器已创建');
      } else {
        console.log('🎬 普通视频，使用HTML5视频播放器');
        
        // 创建视频元素
        var videoElement = document.createElement('video');
        videoElement.controls = true;
        
        // 检查URL参数是否包含autoplay=true
        var autoplayParam = getUrlParameter('autoplay');
        videoElement.autoplay = (autoplayParam === 'true');
        videoElement.playsInline = true;
        
        // 添加视频源
        var source = document.createElement('source');
        source.src = video.src;
        source.type = 'video/mp4';
        videoElement.appendChild(source);
        
        // 错误处理
        videoElement.addEventListener('error', function() {
          console.error('视频加载失败:', video.src);
          container.innerHTML = `
            <div class="error-message">
              <i class="fas fa-exclamation-circle"></i>
              <h3>视频加载失败</h3>
              <p>视频源可能已失效或网络连接有问题</p>
              <p class="small text-muted">视频URL: ${video.src.substring(0, 50)}...</p>
              <a href="index.html" class="btn btn-primary mt-3">返回首页</a>
            </div>
          `;
        });
        
        // 加载成功
        videoElement.addEventListener('loadeddata', function() {
          console.log('视频加载成功');
        });
        
        container.innerHTML = '';
        container.appendChild(videoElement);
      }
      
      // 更新视频信息
      document.getElementById('videoTitle').textContent = video.title;
      document.getElementById('videoArtist').textContent = video.artist;
      document.getElementById('videoAlbum').textContent = video.album;
      document.getElementById('videoDescription').textContent = video.description || '暂无描述';
      info.style.display = 'block';
      
      // 更新页面标题
      document.title = video.title + ' - 丽江音悦台';
    }

    // 渲染相关视频
    function renderRelatedVideos(currentVideo) {
      var container = document.getElementById('relatedVideos');
      var containerWrapper = document.getElementById('relatedVideosContainer');
      
      if (typeof videoData === 'undefined') {
        return;
      }
      
      // 过滤掉当前视频
      allRelatedVideos = videoData.filter(function(v) { return v.id !== currentVideo.id; });
      
      // 侧边栏显示8个视频 (4行 x 2列)
      videosPerPage = 8; 
      
      // 清空容器
      container.innerHTML = '';
      
      // 渲染当前页的视频
      renderCurrentPage();
      
      // 渲染分页控制
      renderPaginationControls();
    }
    
    // 渲染分页控制
    function renderPaginationControls() {
      var containerWrapper = document.getElementById('relatedVideosContainer');
      
      // 移除旧的分页控制
      var oldControls = containerWrapper.querySelector('.pagination-controls');
      if (oldControls) {
        oldControls.remove();
      }
      
      // 计算总页数
      var totalPages = Math.ceil(allRelatedVideos.length / videosPerPage);
      if (totalPages <= 1) return; // 只有一页就不显示分页
      
      // 创建分页控制
      var controlsDiv = document.createElement('div');
      controlsDiv.className = 'pagination-controls d-flex justify-content-between align-items-center mb-3 mt-2';
      
      controlsDiv.innerHTML = `
        <button class="pagination-btn" ${currentPage === 0 ? 'disabled' : ''} id="prev-page-btn">
          <i class="fas fa-chevron-left"></i>
        </button>
        <span class="pagination-info small text-muted">${currentPage + 1} / ${totalPages}</span>
        <button class="pagination-btn" ${currentPage >= totalPages - 1 ? 'disabled' : ''} id="next-page-btn">
          <i class="fas fa-chevron-right"></i>
        </button>
      `;
      
      // 插入到标题后面，列表前面
      var list = document.getElementById('relatedVideos');
      containerWrapper.insertBefore(controlsDiv, list);
      
      // 绑定事件
      document.getElementById('prev-page-btn').onclick = function() {
        if (currentPage > 0) {
          currentPage--;
          renderCurrentPage();
          renderPaginationControls();
        }
      };
      document.getElementById('next-page-btn').onclick = function() {
        if (currentPage < totalPages - 1) {
          currentPage++;
          renderCurrentPage();
          renderPaginationControls();
        }
      };
    }
    
    // 渲染当前页的视频
    function renderCurrentPage() {
      var container = document.getElementById('relatedVideos');
      
      // 清空容器
      container.innerHTML = '';
      
      // 计算当前页的视频范围
      var startIndex = currentPage * videosPerPage;
      var endIndex = Math.min(startIndex + videosPerPage, allRelatedVideos.length);
      var currentVideos = allRelatedVideos.slice(startIndex, endIndex);
      
      // 渲染视频卡片 (侧边栏模式：一行两个)
      currentVideos.forEach(function(video) {
        var col = document.createElement('div');
        col.className = 'col-6 mb-3'; // 实现一行两个
        
        col.innerHTML = `
          <div class="card video-card h-100" onclick="playVideo(${video.id})" style="border:none; background:rgba(255,255,255,0.5); overflow:hidden; transition: transform 0.2s; cursor:pointer;">
            <img src="${video.cover}" style="width: 100%; height: 110px; object-fit: cover;">
            <div class="card-body p-2">
              <h6 class="card-title mb-1 text-truncate" style="font-size: 0.9rem;" title="${video.title}">${video.title}</h6>
              <p class="card-text mb-0 text-muted text-truncate" style="font-size: 0.8rem;">${video.artist}</p>
            </div>
          </div>
        `;
        
        container.appendChild(col);
      });
    }

    // 播放指定视频
    function playVideo(videoId) {
      var video = findVideoById(videoId);
      if (video) {
        currentVideoId = videoId;
        renderVideoPlayer(video);
        renderRelatedVideos(video);
        // 滚动到顶部
        window.scrollTo(0, 0);
      }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
      console.log('🎬 视频播放器页面加载');
      
      var videoId = getUrlParameter('id');
      console.log('📹 视频ID:', videoId);
      
      if (!videoId) {
        console.error('❌ 未提供视频ID');
        document.getElementById('videoContainer').innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>未指定视频</h3>
            <p>请从视频列表选择要播放的视频</p>
            <a href="index.html" class="btn btn-primary mt-3">返回首页</a>
          </div>
        `;
        return;
      }
      
      // 等待视频数据加载
      var checkVideoData = setInterval(function() {
        if (typeof videoData !== 'undefined') {
          clearInterval(checkVideoData);
          console.log('✅ videoData 已加载，视频数量:', videoData.length);
          
          var video = findVideoById(videoId);
          if (video) {
            console.log('✅ 找到视频:', video.title);
            currentVideoId = videoId;
            renderVideoPlayer(video);
            renderRelatedVideos(video);
          } else {
            console.error('❌ 未找到ID为', videoId, '的视频');
            renderVideoPlayer(null);
          }
        }
      }, 100);
      
      // 超时处理
      setTimeout(function() {
        if (typeof videoData === 'undefined') {
          clearInterval(checkVideoData);
          console.error('❌ videoData 加载超时');
          document.getElementById('videoContainer').innerHTML = `
            <div class="error-message">
              <i class="fas fa-exclamation-triangle"></i>
              <h3>数据加载失败</h3>
              <p>视频数据加载超时，请检查网络连接</p>
              <button class="btn btn-primary mt-3" onclick="location.reload()">重新加载</button>
            </div>
          `;
        }
      }, 5000);
    });
  </script>

  <!-- 向上火箭按钮 -->
  <button id="scrollToTopBtn" class="scroll-to-top" onclick="scrollToTop()">
    <i class="fas fa-rocket"></i>
  </button>
  
  <script>
    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    window.onscroll = function() {
      var btn = document.getElementById('scrollToTopBtn');
      if (btn) {
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
          btn.classList.add('show');
        } else {
          btn.classList.remove('show');
        }
      }
    };
  </script>
</body>
</html>
