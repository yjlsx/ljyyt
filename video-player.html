<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自定义视频播放器 - 丽江音悦台</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="scroll_to_top.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background: url('./images/yyt.png') no-referrer center center fixed !important;
      background-size: cover !important;
      padding-top: 70px;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.3);
      z-index: -1;
    }
    
    /* 导航栏样式完全同步首页 */
    .navbar { background-color: #0d6efd !important; }
    .navbar-brand { display: flex !important; align-items: center !important; gap: 10px !important; }
    .brand-name { font-size: 1.2rem !important; font-weight: bold !important; color: white !important; line-height: 1.2; }
    .brand-slogan { font-size: 0.7rem !important; color: rgba(255, 255, 255, 0.8) !important; white-space: nowrap; }

    /* 布局容器 */
    .player-main-layout {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      justify-content: center;
      padding: 20px;
      flex-wrap: wrap; /* 手机端自动换行 */
    }
    
    /* 左侧播放器宽度 */
    .player-left-col { width: 900px; flex: 0 0 auto; max-width: 100%; }
    /* 右侧列表宽度 */
    .player-right-col { width: 400px; flex: 0 0 auto; max-width: 100%; }

    /* 白色外框：PC端留白 30px */
    .video-wrapper {
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px !important; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    
    /* 黑色视频框：锁定 16:9 */
    .video-container {
      width: 100% !important;
      background: #000 !important;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      padding-top: 56.25%; /* 16:9 比例 */
      margin-bottom: 20px;
    }
    .video-container video, .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }
    
    #coverImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    
    #playButtonOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }
    
    #playButtonOverlay i {
      font-size: 5rem;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }
    
    #videoPlaceholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* 视频信息区 */
    .video-info h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 15px; color: #333; }
    .meta-row { display: flex; gap: 20px; margin-bottom: 10px; flex-wrap: wrap; }
    .meta-item { display: flex; align-items: center; color: #666; font-size: 0.95rem; }
    .meta-item i { color: #0d6efd; margin-right: 8px; width: 20px; }
    .description { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; color: #555; line-height: 1.6; }

    /* 右侧列表 */
    .related-videos {
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .video-card { cursor: pointer; transition: transform 0.2s; background: rgba(255,255,255,0.5); border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    .video-card:hover { transform: scale(1.02); }

    /* 分页 */
    .pagination-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .pagination-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .pagination-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* ====================================================== */
    /* 手机端 (Responsive) 深度适配核心代码 */
    /* ====================================================== */
    @media (max-width: 991.98px) {
      .player-main-layout { padding: 10px; }
      
      /* 手机端左右留白缩小到 15px，防止视频太小 */
      .video-wrapper { padding: 15px !important; }
      
      .player-left-col, .player-right-col { width: 100%; }
      
      /* 导航栏标语缩短防止溢出 */
      .brand-slogan { max-width: 180px; overflow: hidden; text-overflow: ellipsis; font-size: 0.6rem !important; }
      
      /* 手机端视频列表一行一个，看得更清楚 */
      .col-6-mobile-fix { width: 100% !important; }
    }
    
    @media (max-width: 575.98px) {
      .brand-name { font-size: 1rem !important; }
      .brand-slogan { display: none; } /* 极窄屏隐藏小标语 */
      .video-info h2 { font-size: 1.1rem; }
      .meta-item { font-size: 0.85rem; }
    }
    
    /* 自定义播放器控件样式 */
    .custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0;
      transition: opacity 0.3s ease;
      /* 添加移动端触摸支持 */
      pointer-events: auto;
    }
    
    .video-container:hover .custom-controls,
    .video-container:focus-within .custom-controls {
      opacity: 1;
    }
    
    /* 移动端触控优化 */
    @media (hover: none) and (pointer: coarse) {
      .custom-controls {
        opacity: 0.8; /* 在触摸设备上始终显示控件，但透明度较低 */
      }
      
      .video-container:active .custom-controls {
        opacity: 1;
      }
    }
    
    .control-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
    }
    
    .control-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
    
    .progress-container {
      flex-grow: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    
    .progress {
      height: 100%;
      background: #0d6efd;
      border-radius: 3px;
      width: 0%;
      position: relative;
    }
    
    .progress-buffer {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      width: 0%;
    }
    
    .time-display {
      color: white;
      font-size: 14px;
      min-width: 80px;
      text-align: center;
    }
    
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .volume-slider {
      width: 80px;
      height: 5px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      outline: none;
    }
    
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
    }
    
    .fullscreen-btn {
      margin-left: auto;
    }
    
    /* 移动端适配 */
    @media (max-width: 768px) {
      .player-main-layout {
        flex-direction: column;
        padding: 10px;
      }
      
      .player-left-col, .player-right-col {
        width: 100%;
      }
      
      .video-wrapper {
        padding: 15px !important;
      }
      
      .custom-controls {
        padding: 10px;
        gap: 10px;
      }
      
      .control-btn {
        width: 35px;
        height: 35px;
        font-size: 0.9rem;
      }
      
      .time-display {
        font-size: 12px;
        min-width: 60px;
      }
      
      .progress-container {
        height: 4px;
      }
      
      .volume-container {
        gap: 5px;
      }
      
      .volume-slider {
        width: 60px;
      }
      
      .video-info h2 {
        font-size: 1.1rem;
      }
      
      .meta-item {
        font-size: 0.85rem;
      }
      
      /* 移动端触摸友好的控件大小 */
      .control-btn {
        touch-action: manipulation;
      }
    }
    
    @media (max-width: 480px) {
      .custom-controls {
        flex-wrap: wrap;
        height: auto;
        min-height: 60px;
      }
      
      .progress-container {
        order: 1;
        width: 100%;
        margin-top: 5px;
      }
      
      .time-display {
        display: none; /* 在极小屏幕上隐藏时间显示，节省空间 */
      }
      
      .player-left-col {
        width: 100%;
      }
    }
    
    /* 全屏模式下的样式 */
    video:-webkit-full-screen {
      max-height: none !important;
      width: 100% !important;
      height: 100% !important;
    }
    
    video:fullscreen {
      max-height: none !important;
      width: 100% !important;
      height: 100% !important;
    }
    
    /* iOS Safari 全屏样式 */
    video:-webkit-full-screen::backdrop {
      background: black;
    }
    
    /* 加载状态样式 */
    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.2rem;
      z-index: 3;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="./images/avatar.jpg" width="40" height="40" class="rounded-circle me-2">
        <div class="d-flex flex-column">
          <span class="brand-name">丽江音悦台</span>

          <li class="nav-item"><a class="nav-link" href="index.html#contact">联系我们</a></li>
        </ul>
        <form class="d-flex mt-2 mt-lg-0" id="search-form" action="search.html" method="GET">
          <input class="form-control me-2" type="search" name="q" placeholder="搜索音乐..." aria-label="搜索">

  </nav>

  <div class="player-main-layout">
    <!-- 左侧区域 -->
    <div class="player-left-col">
      <div class="video-wrapper">
        <div class="video-container" id="videoContainer">
          <div id="videoPlaceholder" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; display: flex; align-items: center; justify-content: center; z-index: 1;">
            <div id="coverImageContainer" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
              <img id="coverImage" src="" alt="视频封面" style="max-width: 100%; max-height: 100%; object-fit: contain; display: none;">
            </div>
            <div id="playButtonOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2;">
              <i class="fas fa-play-circle" style="font-size: 5rem; color: rgba(255,255,255,0.8);"></i>
            </div>
          </div>
          <video id="customPlayer" playsinline webkit-playsinline allowfullscreen style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0;">
            <!-- 这里将动态插入视频源 -->
          </video>
          <div class="custom-controls">
            <button id="playPauseBtn" class="control-btn">
              <i class="fas fa-play"></i>
            </button>
            <div class="time-display">
              <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
            </div>
            <div class="progress-container" id="progressContainer">
              <div class="progress" id="progress"></div>
              <div class="progress-buffer" id="progressBuffer"></div>
            </div>
            <div class="volume-container">
              <button id="volumeBtn" class="control-btn">
                <i class="fas fa-volume-up"></i>
              </button>
              <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
            <button id="fullscreenBtn" class="control-btn fullscreen-btn">
              <i class="fas fa-expand"></i>
            </button>
          </div>
        </div>
        <div class="video-info">
          <h2 id="videoTitle">加载中...</h2>
          <div class="meta-row">
            <div class="meta-item"><i class="fas fa-user"></i><span id="videoArtist">-</span></div>
            <div class="meta-item"><i class="fas fa-compact-disc"></i><span id="videoAlbum">-</span></div>
          </div>
          <div class="description" id="videoDescription"></div>
        </div>
      </div>
    </div>

    <!-- 右侧区域 -->
    <div class="player-right-col">
      <div class="related-videos">
        <h3 class="mb-3" style="font-size: 1.1rem; border-left: 4px solid #0d6efd; padding-left: 10px;">📺 视频列表</h3>
        <div class="pagination-controls" id="paginationControls"></div>
        <div class="row" id="relatedVideos"></div>
      </div>
    </div>
  </div>

  <script src="videos/video_data.js"></script>
  <script>
    var currentPage = 0;
    var videosPerPage = 8;
    var allRelatedVideos = [];
    var isPlaying = false;

    function getUrlParameter(name) {
      var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
      return results ? decodeURIComponent(results[1]) : null;
    }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return min + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function updateProgress() {
      const video = document.getElementById('customPlayer');
      const progress = document.getElementById('progress');
      const currentTimeEl = document.getElementById('currentTime');
      
      const percentage = (video.currentTime / video.duration) * 100;
      progress.style.width = percentage + '%';
      currentTimeEl.textContent = formatTime(video.currentTime);
    }

    function setProgress(e) {
      const video = document.getElementById('customPlayer');
      const progressContainer = document.getElementById('progressContainer');
      
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      const duration = video.duration;
      
      video.currentTime = (clickX / width) * duration;
    }

    function updatePlayButton() {
      const playPauseBtn = document.getElementById('playPauseBtn');
      const video = document.getElementById('customPlayer');
      const icon = playPauseBtn.querySelector('i');
      
      if (video.paused) {
        icon.className = 'fas fa-play';
        isPlaying = false;
      } else {
        icon.className = 'fas fa-pause';
        isPlaying = true;
      }
    }

    function togglePlay() {
      const video = document.getElementById('customPlayer');
      
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function updateVolume() {
      const video = document.getElementById('customPlayer');
      const volumeSlider = document.getElementById('volumeSlider');
      const volumeBtn = document.getElementById('volumeBtn');
      const volumeIcon = volumeBtn.querySelector('i');
      
      video.volume = volumeSlider.value;
      
      // 更新音量图标
      if (video.volume === 0) {
        volumeIcon.className = 'fas fa-volume-mute';
      } else if (video.volume < 0.5) {
        volumeIcon.className = 'fas fa-volume-down';
      } else {
        volumeIcon.className = 'fas fa-volume-up';
      }
    }

    function toggleFullscreen() {
      const video = document.getElementById('customPlayer');
      const videoContainer = document.getElementById('videoContainer');
      
      // 优先尝试使用视频元素进行全屏（移动端兼容性更好）
      if (!document.fullscreenElement) {
        if (video.requestFullscreen) {
          video.requestFullscreen().catch(e => {
            console.warn("Fullscreen failed:", e);
            // 如果视频元素无法全屏，则尝试容器
            fallbackToContainerFullscreen(videoContainer);
          });
        } else if (video.webkitRequestFullscreen) { /* Safari */
          video.webkitRequestFullscreen().catch(e => {
            console.warn("webkitFullscreen failed:", e);
            fallbackToContainerFullscreen(videoContainer);
          });
        } else if (video.msRequestFullscreen) { /* IE11 */
          video.msRequestFullscreen();
        } else {
          // 浏览器不支持全屏API，尝试使用容器
          fallbackToContainerFullscreen(videoContainer);
        }
      } else {
        // 退出全屏
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { /* Safari */
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) { /* IE11 */
          document.msExitFullscreen();
        }
      }
    }

    // 备用方法：使用容器进行全屏
    function fallbackToContainerFullscreen(container) {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) { /* Safari */
        container.webkitRequestFullscreen();
      } else if (container.mozRequestFullScreen) { /* Firefox */
        container.mozRequestFullScreen();
      } else if (container.msRequestFullscreen) { /* IE/Edge */
        container.msRequestFullscreen();
      }
    }

    function renderPlayer(video) {
      const container = document.getElementById('videoContainer');
      const videoElement = document.getElementById('customPlayer');
      const coverImage = document.getElementById('coverImage');
      const playButtonOverlay = document.getElementById('playButtonOverlay');
      const videoPlaceholder = document.getElementById('videoPlaceholder');
      
      // 重置播放器
      if(video.src.includes('bilibili.com')) {
        // 对于B站视频，仍然使用iframe，不使用自定义控件
        let bvid = video.src.match(/bvid=([a-zA-Z0-9]+)/)[1];
        // 不替换整个容器，而是替换video元素
        const iframeHTML = `<iframe src="//player.bilibili.com/player.html?bvid=${bvid}&autoplay=1" frameborder="0" allowfullscreen webkitallowfullscreen mozallowfullscreen style="width:100%; height:100%; position: absolute; top: 0; left: 0;"></iframe>`;
        videoElement.outerHTML = iframeHTML;
        
        // 隐藏占位符元素
        if(videoPlaceholder) {
          videoPlaceholder.style.display = 'none';
        }
      } else {
        // 设置封面图片
        coverImage.src = video.cover;
        coverImage.style.display = 'block';
        videoPlaceholder.style.display = 'flex';
        
        // 为封面图片添加点击事件以开始播放
        playButtonOverlay.onclick = function() {
          const videoElement = document.getElementById('customPlayer');
          videoElement.play().catch(e => {
            console.error("播放失败:", e);
            // 如果自动播放失败，可能需要用户手势才能播放
          });
        };
        
        // 对于普通视频，使用自定义控件
        videoElement.src = video.src;
        videoElement.load();
        
        // 确保视频元素可见
        videoElement.style.display = 'block';
        
        // 绑定事件
        videoElement.addEventListener('timeupdate', updateProgress);
        videoElement.addEventListener('loadedmetadata', function() {
          document.getElementById('totalTime').textContent = formatTime(videoElement.duration);
          document.getElementById('progressBuffer').style.width = '100%';
        });
        videoElement.addEventListener('play', function() {
          updatePlayButton();
          // 播放开始时隐藏封面
          if(videoPlaceholder) {
            videoPlaceholder.style.display = 'none';
          }
        });
        videoElement.addEventListener('pause', function() {
          updatePlayButton();
          // 暂停时不显示封面，用户可能想继续观看
        });
        videoElement.addEventListener('ended', function() {
          updatePlayButton();
          // 视频结束时重新显示封面和播放按钮
          if(videoPlaceholder) {
            videoPlaceholder.style.display = 'flex';
            coverImage.style.display = 'block';
          }
          // 可以在这里添加自动播放下一视频的逻辑
        });
        
        // 添加全屏事件监听器
        videoElement.addEventListener('webkitbeginfullscreen', function() {
          // iOS设备进入全屏时的处理
          console.log("Entering fullscreen on iOS");
        });
        
        videoElement.addEventListener('webkitendfullscreen', function() {
          // iOS设备退出全屏时的处理
          console.log("Exiting fullscreen on iOS");
        });
      }
      
      document.getElementById('videoTitle').innerText = video.title;
      document.getElementById('videoArtist').innerText = video.artist;
      document.getElementById('videoAlbum').innerText = video.album || '默认专辑';
      document.getElementById('videoDescription').innerText = video.description || '暂无描述';
      document.title = video.title + " - 丽江音悦台";
    }

    function renderList() {
      const list = document.getElementById('relatedVideos');
      list.innerHTML = '';
      let start = currentPage * videosPerPage;
      let end = start + videosPerPage;
      let currentVideos = allRelatedVideos.slice(start, end);

      currentVideos.forEach(v => {
        // 修改：点击视频时，将当前页码通过 URL 参数传递，实现翻页记忆
        list.innerHTML += `<div class="col-12 col-md-6 mb-3">
          <div class="video-card h-100" onclick="location.href='video-player.html?id=${v.id}&page=${currentPage}'">
            <img src="${v.cover}" class="w-100" style="height:110px; object-fit:cover;">
            <div class="p-2 small">
              <div class="text-truncate fw-bold">${v.title}</div>
              <div class="text-muted text-truncate">${v.artist}</div>
            </div>
          </div>
        </div>`;
      });
      renderPagination();
    }

    function renderPagination() {
      const controls = document.getElementById('paginationControls');
      let totalPages = Math.ceil(allRelatedVideos.length / videosPerPage);
      controls.innerHTML = `
        <button class="pagination-btn" ${currentPage==0?'disabled':''} onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
        <span class="small text-muted">${currentPage+1} / ${totalPages}</span>
        <button class="pagination-btn" ${currentPage>=totalPages-1?'disabled':''} onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
      `;
    }

    function changePage(dir) {
      currentPage += dir;
      renderList();
    }

    window.onload = function() {
      let id = getUrlParameter('id');
      // 新增：从 URL 获取保存的页码参数
      let savedPage = getUrlParameter('page');
      if (savedPage !== null) {
        currentPage = parseInt(savedPage);
      }
      
      // 绑定自定义控件事件
      document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
      document.getElementById('progressContainer').addEventListener('click', setProgress);
      document.getElementById('volumeSlider').addEventListener('input', updateVolume);
      document.getElementById('volumeBtn').addEventListener('click', function() {
        const video = document.getElementById('customPlayer');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = this.querySelector('i');
        
        if (video.volume > 0) {
          // 存储当前音量值以便恢复
          video.setAttribute('data-prev-volume', video.volume);
          video.volume = 0;
          volumeSlider.value = 0;
          volumeIcon.className = 'fas fa-volume-mute';
        } else {
          // 恢复之前的音量
          const prevVolume = video.getAttribute('data-prev-volume') || 1;
          video.volume = parseFloat(prevVolume);
          volumeSlider.value = prevVolume;
          if (prevVolume < 0.5) {
            volumeIcon.className = 'fas fa-volume-down';
          } else {
            volumeIcon.className = 'fas fa-volume-up';
          }
        }
      });
      document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
      
      let video = videoData.find(v => v.id == id);
      if(video) {
        renderPlayer(video);
        allRelatedVideos = videoData.filter(v => v.id != id);
        renderList();
      }
    }
  </script>
</body>
</html>
