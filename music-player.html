<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="丽江音悦台 - 音乐播放页">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://res.wx.qq.com" crossorigin>
  <link rel="preconnect" href="https://mmbiz.qpic.cn" crossorigin>
  <title>丽江音悦台</title>
  <link rel="icon" href="./images/avatar.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="./images/avatar.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="main.css">
  <style>
    :root {
      --app-nav-height: 56px;
      --mobile-bottom-player-space: 108px;
      --player-bg: #0d1117;
      --player-bg-2: #161b22;
      --player-panel: rgba(13, 17, 23, 0.85);
      --player-panel-strong: rgba(13, 17, 23, 0.95);
      --player-border: rgba(255, 255, 255, 0.06);
      --player-text: #e6edf3;
      --player-muted: #8b949e;
      --player-accent: #58a6ff;
      --player-accent-2: #3fb950;
      --player-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      color: var(--player-text);
      background:
        radial-gradient(circle at 15% 20%, rgba(88, 166, 255, 0.08), transparent 30%),
        radial-gradient(circle at 80% 25%, rgba(63, 185, 80, 0.06), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(139, 92, 246, 0.05), transparent 35%),
        linear-gradient(180deg, #0d1117 0%, #161b22 40%, #0d1117 100%);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('./images/yyt.png') center center / cover no-repeat;
      opacity: 0.04;
      filter: blur(4px) saturate(0.6);
      transform: scale(1.04);
      pointer-events: none;
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(13, 17, 23, 0.4), rgba(13, 17, 23, 0.8));
      pointer-events: none;
      z-index: -1;
    }

    .navbar {
      background:
        linear-gradient(180deg, rgba(30, 41, 59, 0.82), rgba(22, 27, 34, 0.74)) !important;
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
    }

    body.music-player-page .navbar .form-control {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
    }

    body.music-player-page .navbar .form-control::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    body.music-player-page .navbar .btn-outline-light,
    body.music-player-page #btn-dark {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: rgba(255, 255, 255, 0.16) !important;
      color: #f8fafc !important;
      box-shadow: none !important;
    }

    body.music-player-page .navbar .btn-outline-light:hover,
    body.music-player-page #btn-dark:hover {
      background: rgba(51, 195, 255, 0.18) !important;
      border-color: rgba(94, 234, 212, 0.28) !important;
      color: #ffffff !important;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: white;
    }

    .brand-slogan {
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.72);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .music-shell {
      max-width: 1480px;
      margin: 0 auto;
      padding: 0 20px 0;
      height: calc(100dvh - var(--app-nav-height));
      padding-top: var(--app-nav-height);
    }

    .music-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 460px;
      gap: 22px;
      align-items: start;
      height: calc(100dvh - var(--app-nav-height) - 80px);
      padding-top: 18px;
    }

    .player-panel {
      background: var(--player-panel);
      border: 1px solid var(--player-border);
      border-radius: 20px;
      box-shadow: var(--player-shadow);
      backdrop-filter: blur(16px);
    }

    .player-stage {
      height: 100%;
      padding: 22px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(140deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.005)),
        radial-gradient(circle at 20% 25%, rgba(88, 166, 255, 0.08), transparent 30%),
        radial-gradient(circle at 75% 20%, rgba(63, 185, 80, 0.06), transparent 28%),
        radial-gradient(circle at 50% 85%, rgba(139, 92, 246, 0.06), transparent 32%);
    }

    .player-stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.18));
      pointer-events: none;
    }

    .stage-topbar,
    .stage-main,
    .stage-bottom {
      position: relative;
      z-index: 1;
    }

    .stage-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .stage-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--player-accent-2);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .stage-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stage-action {
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: white;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .stage-action.primary {
      background: linear-gradient(135deg, rgba(88, 166, 255, 0.85), rgba(139, 92, 246, 0.75));
      border-color: transparent;
    }

    .stage-action:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.1);
    }

    .stage-main {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
      min-height: 200px;
      flex: 1;
      min-height: 0;
      margin-bottom: 12px;
    }

    .cover-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 14px;
    }

    .cover-frame {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      padding: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .cover-frame::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(139,148,158,0.9));
      box-shadow: inset 0 0 0 6px rgba(13, 17, 23, 0.85);
      pointer-events: none;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      animation: coverPulse 10s ease-in-out infinite;
    }

    .cover-art.playing {
      animation: coverPulse 10s ease-in-out infinite, coverRotate 18s linear infinite;
    }

    .info-zone {
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .hero-title {
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--player-text);
      margin: 0 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-artist {
      color: var(--player-muted);
      font-size: 0.88rem;
      margin: 0 0 10px;
      display: none;
    }

    .hero-summary {
      max-width: 640px;
      color: #adbac7;
      line-height: 1.6;
      font-size: 0.82rem;
      margin: 0 0 14px;
      display: none;
    }

    .cover-meta-panel {
      width: 100%;
      max-width: 260px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
    }

    .cover-meta-list {
      display: grid;
      gap: 10px;
    }

    .cover-meta-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      color: #c9d1d9;
      font-size: 0.8rem;
    }

    .cover-meta-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(88, 166, 255, 0.12);
      color: var(--player-accent);
      font-size: 0.8rem;
    }

    .cover-meta-icon.mode-toggle {
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .cover-meta-icon.mode-toggle:hover {
      transform: translateY(-1px);
      background: rgba(88, 166, 255, 0.2);
      color: #ffffff;
    }

    .cover-meta-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cover-meta-label {
      color: var(--player-muted);
      font-size: 0.7rem;
      line-height: 1;
    }

    .cover-meta-value {
      color: var(--player-text);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }

    .info-copy {
      margin-bottom: 14px;
      flex: 0 0 auto;
    }

    .stage-transport {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      margin-top: 18px;
      justify-content: center;
    }

    .stage-transport-btn {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      color: var(--player-text);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    .stage-transport-btn:hover {
      transform: translateY(-1px);
      background: rgba(88, 166, 255, 0.14);
      border-color: rgba(88, 166, 255, 0.2);
    }

    .stage-transport-btn.prev,
    .stage-transport-btn.next,
    .stage-transport-btn.mode {
      width: 48px;
      height: 48px;
      font-size: 1rem;
    }

    .stage-transport-btn.play {
      width: 64px;
      height: 64px;
      font-size: 1.2rem;
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      color: var(--player-text);
    }

    .stage-transport-btn.play:hover {
      background: rgba(88, 166, 255, 0.14);
      border-color: rgba(88, 166, 255, 0.22);
    }

    .stage-transport-btn.play.is-playing {
      background: linear-gradient(135deg, rgba(88, 166, 255, 0.92), rgba(139, 92, 246, 0.88));
      border-color: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    .stage-transport-btn.play.is-playing:hover {
      background: linear-gradient(135deg, rgba(88, 166, 255, 1), rgba(139, 92, 246, 0.95));
    }

    .content-panel {
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 14px 16px;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overflow-x: hidden;
    }

    .lyrics-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .lyrics-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      display: none;
    }

    .lyrics-source {
      color: var(--player-muted);
      font-size: 0.78rem;
      line-height: 1.3;
    }

    .lyrics-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lyrics-action-btn {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      color: var(--player-text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .lyrics-action-btn:hover {
      transform: translateY(-1px);
      background: rgba(88, 166, 255, 0.14);
      border-color: rgba(88, 166, 255, 0.2);
    }

    .lyrics-search-panel {
      display: none;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .lyrics-search-panel.is-open {
      display: block;
    }

    .lyrics-search-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .lyrics-search-input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--player-text);
      padding: 10px 12px;
      font-size: 0.84rem;
      outline: none;
    }

    .lyrics-search-input::placeholder {
      color: rgba(230, 237, 243, 0.42);
    }

    .lyrics-search-status {
      color: var(--player-muted);
      font-size: 0.78rem;
      margin-top: 10px;
      line-height: 1.5;
    }

    .lyrics-search-results {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding-right: 4px;
    }

    .lyrics-search-item {
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .lyrics-search-item.is-current {
      background: rgba(88, 166, 255, 0.16);
      border-color: rgba(88, 166, 255, 0.34);
      box-shadow: inset 0 0 0 1px rgba(88, 166, 255, 0.18);
    }

    .lyrics-search-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lyrics-search-title {
      color: var(--player-text);
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .lyrics-search-desc {
      color: var(--player-muted);
      font-size: 0.76rem;
      line-height: 1.4;
    }

    .lyrics-search-use {
      flex: 0 0 auto;
      border: none;
      border-radius: 10px;
      background: rgba(88, 166, 255, 0.16);
      color: #fff;
      padding: 8px 12px;
      font-size: 0.76rem;
      font-weight: 800;
    }

    .lyrics-search-use.is-current {
      background: rgba(88, 166, 255, 0.28);
      color: #ffffff;
    }

    .lyrics-current-badge {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(88, 166, 255, 0.18);
      color: #dbeafe;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .lyrics-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .lyrics-title {
      font-size: 1rem;
      font-weight: 800;
      margin: 0;
    }

    .lyrics-subtitle {
      color: var(--player-muted);
      font-size: 0.82rem;
    }

    .lyrics-lines {
      display: grid;
      gap: 6px;
      min-height: 100px;
      flex: 1;
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding-right: 4px;
      scrollbar-gutter: stable;
      justify-items: center;
      scroll-behavior: smooth;
    }

    .lyric-line {
      color: rgba(230, 237, 243, 0.4);
      font-size: 0.82rem;
      line-height: 1.5;
      transition: all 0.28s ease;
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    .lyric-line.active {
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      transform: scale(1.02);
    }

    .lyric-line.dim {
      opacity: 0.35;
    }

    .queue-panel {
      padding: 18px 18px 14px;
      position: sticky;
      top: 56px;
      height: calc(100dvh - 56px - 80px);
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(140deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.005)),
        radial-gradient(circle at 20% 25%, rgba(88, 166, 255, 0.08), transparent 30%),
        radial-gradient(circle at 75% 20%, rgba(63, 185, 80, 0.06), transparent 28%),
        radial-gradient(circle at 50% 85%, rgba(139, 92, 246, 0.06), transparent 32%);
      border-color: rgba(255, 255, 255, 0.06);
    }

    .queue-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.18));
      pointer-events: none;
      border-radius: inherit;
      z-index: 0;
    }

    .queue-panel > * { position: relative; z-index: 1; }

    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .queue-title {
      font-size: 1.08rem;
      font-weight: 800;
      margin: 0;
    }

    .queue-count {
      color: #a8bdd4;
      font-size: 0.82rem;
      display: none;
    }

    .player-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .queue-search {
      height: 36px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      flex: 0 0 36px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .queue-search-input {
      min-width: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      color: #e6edf3;
      padding: 0;
      outline: none;
      font-size: 15px;
    }

    .queue-search-input::placeholder {
      color: rgba(230, 237, 243, 0.45);
    }

    .queue-search-input:focus {
      box-shadow: none;
    }

    .queue-search-icon,
    .queue-search-clear {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(230, 237, 243, 0.5);
    }

    .queue-search-icon {
      pointer-events: none;
      width: 16px;
      height: 16px;
      opacity: 0.7;
    }

    .queue-search-clear {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      border-radius: 999px;
      padding: 0;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .queue-search-clear:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .queue-search-clear .line-icon {
      width: 14px;
      height: 14px;
    }

    .queue-filter-toggle {
      display: none;
      min-height: 36px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
      color: rgba(241, 245, 249, 0.82);
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
    }

    .line-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .player-tab {

        padding-bottom: calc(var(--nowbar-height) + 36px + env(safe-area-inset-bottom, 0px)) !important;
      }

      .music-layout {
        display: block;
        min-height: 0 !important;
        padding-top: 12px;
      }

      .player-stage {
        min-height: 0;
        max-height: none;
        overflow: visible;
      }

      .stage-main {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .cover-frame {
        width: min(58vw, 210px);
        height: min(58vw, 210px);
        padding: 12px;
      }

      .cover-frame::after {
        width: 18px;
        height: 18px;
      }

      .cover-meta-panel {
        display: none;
      }

      .stage-transport {
        gap: 14px;
        margin-top: 12px;
      }

      .stage-transport-btn.prev,
      .stage-transport-btn.next,
      .stage-transport-btn.mode {
        width: 44px;
        height: 44px;
      }

      .stage-transport-btn.play {
        width: 60px;
        height: 60px;
      }

      .content-panel {
        min-height: 220px;
        max-height: none;
      }

      .lyrics-lines {
        min-height: 160px;
        max-height: 28vh;
      }

      .queue-panel {
        position: fixed !important;
        left: 0;
        right: 0;
        bottom: calc(var(--nowbar-height) + env(safe-area-inset-bottom, 0px));
        top: auto !important;
        z-index: 1100;
        height: min(72dvh, 620px) !important;
        border-radius: 24px 24px 0 0;
        transform: translateY(110%);
        transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
        padding: 18px 14px 12px;
        max-height: none;
      }

      .queue-filter-toggle {
        display: inline-flex;
        margin-bottom: 12px;
      }

      .queue-search {
        display: none;
        height: 0;
        margin-bottom: 0;
        overflow: hidden;
      }

      body.queue-filter-open .queue-search {
        display: flex !important;
        height: 40px !important;
        min-height: 40px !important;
        flex-basis: 40px !important;
        margin-bottom: 12px;
        overflow: visible;
      }

      body.queue-filter-open .queue-search-input {
        height: 38px !important;
        min-height: 38px !important;
      }

      body.queue-open .queue-panel {
        transform: translateY(0);
      }

      .queue-header {
        flex-direction: row;
        align-items: center;
      }

      .queue-header::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 50%;
        width: 42px;
        height: 4px;
        border-radius: 999px;
        transform: translateX(-50%);
        background: rgba(255,255,255,.22);
      }

      .queue-list {
        min-height: 0;
        max-height: none;
      }

      .app-nowbar {
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        min-height: calc(var(--nowbar-height) + env(safe-area-inset-bottom, 0px));
        border-radius: 22px 22px 0 0;
        transform: none;
        padding: 9px 10px calc(9px + env(safe-area-inset-bottom, 0px));
        gap: 8px;
        overflow: visible;
      }

      .now-cover {
        width: 46px;
        height: 46px;
        flex-basis: 46px;
        border-radius: 13px;
      }

      .now-track {
        flex: 1 1 auto;
        gap: 9px;
        min-width: 0;
      }

      .now-copy h2 {
        font-size: 0.84rem;
      }

      .now-copy p {
        font-size: 0.7rem;
      }

      .now-controls {
        gap: 6px;
        flex-shrink: 0;
      }

      .now-btn {
        width: 40px;
        height: 40px;
        border-radius: 14px;
      }

      .now-btn.primary {
        width: 46px;
        height: 46px;
      }

      .now-progress {
        position: absolute;
        left: 10px;
        right: 10px;
        top: -12px;
        min-width: 0;
        display: block;
        z-index: 2;
      }

      .now-progress span {
        display: none;
      }

      .now-progress-track {
        height: 36px;
      }

      .now-progress-line {
        height: 4px;
      }

      .now-actions,
      .now-volume {
        display: none;
      }

      #mobile-queue-toggle {
        display: inline-flex;
      }
    }
  </style>
</head>
<body class="music-player-page">
  <header class="app-player-topbar" aria-label="播放器导航">
    <a class="app-player-brand" href="index.html" aria-label="返回丽江音悦台首页">
      <img src="./images/avatar.jpg" alt="丽江音悦台">
      <span>
        <strong>丽江音悦台</strong>
        <span>纳西音乐播放器</span>
      </span>
    </a>
    <nav class="app-player-nav" aria-label="播放器页导航">
      <a href="index.html"><i class="fas fa-home" aria-hidden="true"></i>首页</a>
      <a class="app-search-entry" href="search.html" aria-label="搜索音乐">
        <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.3-4.3"></path>
          <circle cx="11" cy="11" r="6.5"></circle>
        </svg>
        <span>搜索</span>
      </a>
      <button id="mobile-queue-toggle" type="button" aria-label="打开播放队列">
        <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6h13M8 12h13M8 18h13"></path>
          <path d="M3 6h.01M3 12h.01M3 18h.01"></path>
        </svg>
        <span>队列</span>
      </button>
    </nav>
  </header>

  <main class="music-shell">
    <div class="music-layout">
      <section class="player-panel player-stage">
        <div class="stage-topbar">
          <div class="stage-badge">
            <i class="fas fa-headphones-alt"></i>
            <span id="hero-status">正在准备播放器</span>
          </div>
          <div class="stage-actions">
            <button class="stage-action" id="scroll-current-track" type="button">
              <i class="fas fa-crosshairs me-2"></i>定位当前歌曲
            </button>
          </div>
        </div>

        <div class="stage-main">
          <div class="cover-wrap">
            <div class="cover-frame">
              <img id="hero-cover" class="cover-art" src="./images/avatar.jpg" alt="当前歌曲封面">
            </div>
            <div class="cover-meta-panel">
              <div class="cover-meta-list">
                <div class="cover-meta-item">
                  <span class="cover-meta-icon"><i class="fas fa-user"></i></span>
                  <div class="cover-meta-copy">
                    <span class="cover-meta-label">歌手</span>
                    <span class="cover-meta-value" id="hero-artist-chip">-</span>
                  </div>
                </div>
                <div class="cover-meta-item">
                  <span class="cover-meta-icon"><i class="fas fa-record-vinyl"></i></span>
                  <div class="cover-meta-copy">
                    <span class="cover-meta-label">专辑</span>
                    <span class="cover-meta-value" id="hero-album">纳西音乐精选</span>
                  </div>
                </div>
                <div class="cover-meta-item">
                  <span class="cover-meta-icon"><i class="fas fa-clock"></i></span>
                  <div class="cover-meta-copy">
                    <span class="cover-meta-label">时长</span>
                    <span class="cover-meta-value" id="hero-duration">0:00</span>
                  </div>
                </div>
                <div class="cover-meta-item">
                  <span class="cover-meta-icon"><i class="fas fa-wave-square"></i></span>
                  <div class="cover-meta-copy">
                    <span class="cover-meta-label">播放状态</span>
                    <span class="cover-meta-value" id="side-playing-state">未播放</span>
                  </div>
                </div>
                <div class="cover-meta-item">
                  <button class="cover-meta-icon mode-toggle" id="side-mode-toggle" type="button" aria-label="切换播放模式" title="切换播放模式">
                    <i class="fas fa-repeat"></i>
                  </button>
                  <div class="cover-meta-copy">
                    <span class="cover-meta-label">播放模式</span>
                    <span class="cover-meta-value" id="side-mode">顺序播放</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="info-zone">
            <div class="info-copy">
              <h2 id="hero-title" class="hero-title">请选择一首歌曲</h2>
              <p id="hero-artist" class="hero-artist"></p>
              <p id="hero-summary" class="hero-summary">中间是主题主舞台，右边是独立播放列表，底部保留真实的播放控制条。</p>
              <div class="stage-transport">
                <button class="stage-transport-btn mode" id="stage-mode-btn" type="button" aria-label="切换播放模式" title="切换播放模式">
                  <i class="fas fa-repeat"></i>
                </button>
                <button class="stage-transport-btn prev" id="stage-prev-btn" type="button" aria-label="上一首">
                  <i class="fas fa-step-backward"></i>
                </button>
                <button class="stage-transport-btn play" id="stage-play-btn" type="button" aria-label="播放或暂停">
                  <i class="fas fa-play"></i>
                </button>
                <button class="stage-transport-btn next" id="stage-next-btn" type="button" aria-label="下一首">
                  <i class="fas fa-step-forward"></i>
                </button>
              </div>
            </div>

            <section class="content-panel">
            <div class="lyrics-toolbar">
              <div class="lyrics-meta">
                <h3 class="lyrics-title">歌词</h3>
                <div class="lyrics-source" id="lyrics-source-label">当前来源：等待加载</div>
              </div>
              <div class="lyrics-actions">
                <button class="lyrics-action-btn" id="lyrics-search-toggle" type="button">搜索歌词</button>
              </div>
            </div>
            <div class="lyrics-search-panel" id="lyrics-search-panel">
              <div class="lyrics-search-form">
                <input id="lyrics-search-title" class="lyrics-search-input" type="text" placeholder="输入歌名，可单独搜索">
                <input id="lyrics-search-artist" class="lyrics-search-input" type="text" placeholder="输入歌手，可单独搜索">
                <button class="lyrics-action-btn" id="lyrics-search-submit" type="button">搜索</button>
              </div>
              <div class="lyrics-search-status" id="lyrics-search-status">支持只填歌名、只填歌手，或两者一起搜索。手动候选默认优先显示酷狗结果，便于更稳定地挑歌词版本。</div>
              <div class="lyrics-search-results" id="lyrics-search-results"></div>
            </div>
            <div class="lyrics-lines" id="lyrics-lines">
              <div class="lyric-line active">暂无歌词，正在尝试匹配</div>
              <div class="lyric-line">没有找到歌词时，可以手动搜索更多版本。</div>
            </div>
            </section>
          </div>
        </div>
      </section>

      <aside class="player-panel queue-panel">
        <div class="queue-header">
          <div>
            <h3 class="queue-title" id="library-title">播放队列</h3>
            <div class="queue-count" id="queue-count"></div>
          </div>
          <i class="fas fa-stream" style="color: var(--player-accent);"></i>
        </div>

        <div class="player-tabs" role="tablist" aria-label="播放队列筛选">
          <button class="player-tab active" type="button" data-view="all">全部歌曲</button>
          <button class="player-tab" type="button" data-view="favorites">收藏</button>
          <button class="player-tab" type="button" data-view="history">最近播放</button>
        </div>

        <button id="queue-filter-toggle" class="queue-filter-toggle" type="button" aria-expanded="false" aria-controls="queue-search-input">
          <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 21-4.3-4.3"></path>
            <circle cx="11" cy="11" r="6.5"></circle>
          </svg>
          <span>筛选队列</span>
        </button>

        <div class="queue-search">
          <span class="queue-search-icon" aria-hidden="true">
            <svg class="line-icon" viewBox="0 0 24 24">
              <path d="m21 21-4.3-4.3"></path>
              <circle cx="11" cy="11" r="6.5"></circle>
            </svg>
          </span>
          <input id="queue-search-input" class="queue-search-input" type="search" placeholder="搜索歌名或歌手" aria-label="搜索播放队列">
          <button id="queue-search-clear" class="queue-search-clear" type="button" aria-label="清空播放队列搜索" title="清空搜索">
            <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>

        <div class="queue-list">
          <div class="row" id="music-list"></div>
        </div>
      </aside>
    </div>
  </main>

  <div class="queue-scrim" id="queue-scrim" aria-hidden="true"></div>

  <audio id="audio-player" preload="metadata"></audio>
  <footer class="app-nowbar" aria-label="当前播放">
    <div class="now-track">
      <img id="current-cover" class="now-cover" src="./images/avatar.jpg" alt="专辑封面">
      <div class="now-copy">
        <h2 id="current-title" aria-live="polite">请选择一首歌曲</h2>
        <p id="current-artist">-</p>
      </div>
    </div>
    <div class="now-controls" aria-label="播放控制">
      <button id="prev-btn" class="now-btn" type="button" aria-label="上一首"><i class="fas fa-step-backward" aria-hidden="true"></i></button>
      <button id="play-btn" class="now-btn primary" type="button" aria-label="开始播放" aria-pressed="false"><i class="fas fa-play" aria-hidden="true"></i></button>
      <button id="next-btn" class="now-btn" type="button" aria-label="下一首"><i class="fas fa-step-forward" aria-hidden="true"></i></button>
    </div>
    <div class="now-progress" aria-label="播放进度">
      <span id="current-time">0:00</span>
      <div id="progress-container" class="now-progress-track" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="now-progress-line"><div id="progress-bar"></div></div>
      </div>
      <span id="total-time">0:00</span>
    </div>
    <div class="now-actions">
      <button id="btn-mode" class="now-btn" type="button" aria-label="切换播放模式"><i class="fas fa-list-ol" aria-hidden="true"></i></button>
      <button id="btn-fav" class="now-btn" type="button" aria-label="收藏当前歌曲" aria-pressed="false"><i class="far fa-heart" aria-hidden="true"></i></button>
      <button id="mobile-queue-toggle-bottom" class="now-btn" type="button" aria-label="打开播放队列"><i class="fas fa-stream" aria-hidden="true"></i></button>
    </div>
    <label class="now-volume" aria-label="音量">
      <i class="fas fa-volume-up" aria-hidden="true"></i>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
    </label>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="videos/video_data.js"></script>
  <script src="player_state.js"></script>
  <script src="site-config.js"></script>
  <script src="script.js"></script>
  <script src="music_player_page.js?v=app-player-20260528"></script>
</body>
</html>
