<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">

  <!-- SEO Meta -->
  <meta name="description" content="丽江音悦台 - 纳西族音乐视频播放器">
  <meta name="robots" content="noindex">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <title>丽江音悦台</title>
  <link rel="icon" href="./images/avatar.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="./images/avatar.jpg">
  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="main.css">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2) !important;
      padding-top: 70px;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(245,247,250,0.9), rgba(195,207,226,0.88));
      z-index: -2;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url('./images/yyt.png') center center / cover no-repeat;
      opacity: 0.18;
      z-index: -3;
      pointer-events: none;
      transform: translateZ(0);
    }
    body.dark-mode::before {
      background: linear-gradient(135deg, rgba(10,10,20,0.94), rgba(15,15,30,0.92));
    }
    body.dark-mode::after {
      opacity: 0.12;
      filter: saturate(0.85) brightness(0.7);
    }

    /* 导航栏 */
    .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; }
    .navbar-brand { display: flex; align-items: center; gap: 10px; }
    .brand-name { font-size: 1.2rem; font-weight: bold; color: white; line-height: 1.2; }
    .brand-slogan { font-size: 0.7rem; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    /* 布局 */
    .player-main-layout {
      display: flex;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      flex-wrap: wrap;
    }
    .player-left-col { width: 900px; flex: 0 0 auto; max-width: 100%; }
    .player-right-col { width: 400px; flex: 0 0 auto; max-width: 100%; }

    /* 视频外框 */
    .video-wrapper {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid rgba(255,255,255,0.6);
    }
    body.dark-mode .video-wrapper {
      background: rgba(22,33,62,0.95);
      border-color: rgba(255,255,255,0.06);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    /* 视频容器 */
    .video-container {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      padding-top: 56.25%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .video-container video, .video-container iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000;
    }
    .video-container:fullscreen,
    .video-container:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      padding-top: 0 !important;
      border-radius: 0 !important;
      background: #000 !important;
    }
    .video-container:fullscreen video,
    .video-container:fullscreen iframe,
    .video-container:-webkit-full-screen video,
    .video-container:-webkit-full-screen iframe {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
    }
    .video-container.is-faux-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      padding-top: 0 !important;
      z-index: 99999 !important;
      border-radius: 0 !important;
      background: #000 !important;
    }
    body.video-faux-fullscreen {
      overflow: hidden !important;
    }

    #coverImage { max-width: 100%; max-height: 100%; object-fit: contain; }

    #playButtonOverlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2;
      background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 100%);
      transition: background 0.3s;
    }
    #playButtonOverlay:hover { background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.4) 100%); }
    #playButtonOverlay i {
      font-size: 5rem;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.3s, text-shadow 0.3s;
    }
    #playButtonOverlay:hover i { transform: scale(1.1); text-shadow: 0 4px 30px rgba(102,126,234,0.5); }

    #videoPlaceholder {
      position: absolute; inset: 0;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
    }

    /* 视频信息区 */
    .video-info { padding: 8px 4px 0; }
    .video-info h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #222;
      line-height: 1.4;
    }
    body.dark-mode .video-info h2 { color: var(--dk-text); }
    .meta-row {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .meta-item {
      display: flex;
      align-items: center;
      color: #666;
      font-size: 0.9rem;
      padding: 6px 14px;
      background: rgba(102,126,234,0.06);
      border-radius: 20px;
    }
    .meta-item i { color: #667eea; margin-right: 8px; width: 16px; text-align: center; }
    body.dark-mode .meta-item { background: rgba(102,126,234,0.12); color: var(--dk-muted); }
    body.dark-mode .meta-item i { color: #8b9cf7; }
    .description {
      margin-top: 16px;
      padding: 16px;
      background: rgba(0,0,0,0.02);
      border-radius: 10px;
      color: #555;
      line-height: 1.7;
      font-size: 0.92rem;
    }
    body.dark-mode .description { background: rgba(255,255,255,0.03); color: var(--dk-muted); }

    /* 右侧列表 */
    .related-videos {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.6);
    }
    body.dark-mode .related-videos {
      background: rgba(22,33,62,0.95);
      border-color: rgba(255,255,255,0.06);
    }
    .related-videos h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      padding-left: 12px;
      border-left: 3px solid #667eea;
      color: #333;
    }
    body.dark-mode .related-videos h3 { color: var(--dk-text); }

    .video-card {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .video-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .video-card.active-card {
      border-color: #667eea;
      box-shadow: 0 6px 20px rgba(102,126,234,0.25);
    }
    .video-card img { transition: transform 0.3s; }
    .video-card:hover img { transform: scale(1.05); }
    body.dark-mode .video-card { background: var(--dk-surface); border-color: var(--dk-border); }
    body.dark-mode .video-card:hover { border-color: rgba(102,126,234,0.3); }

    /* 分页 */
    .pagination-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .pagination-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(102,126,234,0.3);
    }
    .pagination-btn:hover:not(:disabled) { transform: scale(1.1); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
    .pagination-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

    /* ====================================================== */
    /* 手机端 (Responsive) 深度适配核心代码 */
    /* ====================================================== */
    @media (max-width: 991.98px) {
      body::after { display: none; }
      .player-main-layout { padding: 12px; gap: 16px; }
      
      /* 手机端左右留白缩小到 15px，防止视频太小 */
      .video-wrapper { padding: 15px !important; }
      
      .player-left-col, .player-right-col { width: 100%; }
      
      /* 导航栏标语缩短防止溢出 */
      .brand-slogan { max-width: 180px; overflow: hidden; text-overflow: ellipsis; font-size: 0.6rem !important; }
      
      /* 手机端视频列表一行一个，看得更清楚 */
      .col-6-mobile-fix { width: 100% !important; }
    }
    
    @media (max-width: 575.98px) {
      .brand-name { font-size: 1rem !important; }
      .brand-slogan { display: none; } /* 极窄屏隐藏小标语 */
      .video-info h2 { font-size: 1.1rem; }
      .meta-item { font-size: 0.85rem; }
      .video-wrapper,
      .related-videos { backdrop-filter: none; }
      .player-main-layout {
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
      }
      .video-wrapper,
      .related-videos {
        border-radius: 14px;
      }
      .related-videos {
        padding: 16px;
      }
      .pagination-controls {
        gap: 10px;
      }
      .pagination-btn {
        width: 40px;
        height: 40px;
      }
    }
    
    /* 自定义播放器控件样式 */
    .custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      padding: 20px 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(0);
      pointer-events: auto;
    }
    .video-container.hide-controls .custom-controls {
      opacity: 1;
      transform: translateY(0);
    }
    .video-container.hide-controls .custom-controls .control-btn,
    .video-container.hide-controls .custom-controls .time-display,
    .video-container.hide-controls .custom-controls .volume-container {
      opacity: 0;
      pointer-events: none;
    }
    
    .video-container:hover .custom-controls,
    .video-container:focus-within .custom-controls {
      opacity: 1;
      transform: translateY(0);
    }
    
    .control-btn {
      background: transparent;
      border: none;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }
    
    .control-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      transform: scale(1.1);
    }
    
    .progress-container {
      flex-grow: 1;
      height: 36px;
      background: transparent;
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      transition: height 0.2s;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .progress-container::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 8px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: rgba(255,255,255,.36);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 2px 10px rgba(0,0,0,.28);
    }
    
    .progress-container:hover {
      height: 36px;
    }

    .progress {
      position: absolute;
      left: 0;
      top: 50%;
      height: 8px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 999px;
      width: 0%;
      box-shadow: 0 0 12px rgba(102, 126, 234, 0.5);
      z-index: 2;
    }
    
    /* 进度条上的小白点 */
    .progress::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      opacity: 1;
      transition: opacity 0.2s;
    }
    
    .progress-container:hover .progress::after {
      opacity: 1;
    }
    
    .progress-buffer {
      position: absolute;
      left: 0;
      top: 50%;
      height: 8px;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      width: 0%;
      z-index: 1;
    }
    
    .time-display {
      color: white;
      font-size: 14px;
      min-width: 80px;
      text-align: center;
    }
    
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .volume-slider {
      width: 80px;
      height: 5px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      outline: none;
    }
    
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
    }
    
    .fullscreen-btn {
      margin-left: auto;
    }
    
    /* 移动端适配 */
    @media (max-width: 768px) {
      .player-main-layout {
        flex-direction: column;
        padding: 12px;
      }
      
      .player-left-col, .player-right-col {
        width: 100%;
      }
      
      .video-wrapper {
        padding: 15px !important;
      }
      
      .custom-controls {
        padding: 12px;
        gap: 10px;
      }
      
      .control-btn {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }
      
      .time-display {
        font-size: 12px;
        min-width: 60px;
      }
      
      .progress-container {
        height: 36px;
      }
      
      .volume-container {
        gap: 5px;
      }
      
      .volume-slider {
        width: 60px;
      }
      
      .video-info h2 {
        font-size: 1.1rem;
      }
      
      .meta-item {
        font-size: 0.85rem;
      }
      
      /* 移动端触摸友好的控件大小 */
      .control-btn {
        touch-action: manipulation;
      }

      .meta-row {
        gap: 10px;
      }
    }
    
    @media (max-width: 480px) {
      .custom-controls {
        flex-wrap: wrap;
        height: auto;
        min-height: 68px;
      }
      
      .progress-container {
        order: 1;
        width: 100%;
        margin-top: 6px;
        height: 36px;
      }
      
      .time-display {
        display: none; /* 在极小屏幕上隐藏时间显示，节省空间 */
      }
      
      .player-left-col {
        width: 100%;
      }

      .volume-container {
        display: none;
      }

      .control-btn {
        width: 42px;
        height: 42px;
      }

      #playButtonOverlay i {
        font-size: 4rem !important;
      }
    }
    
    /* 全屏模式下的样式 */
    video:-webkit-full-screen {
      max-height: none !important;
      width: 100% !important;
      height: 100% !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 9999 !important;
    }
    
    video:fullscreen {
      max-height: none !important;
      width: 100% !important;
      height: 100% !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 9999 !important;
    }
    
    /* iOS Safari 全屏样式 */
    video:-webkit-full-screen::backdrop {
      background: black;
    }
    
    /* 移动端全屏优化 */
    @media (max-width: 768px) {
      video:-webkit-full-screen {
        object-fit: contain !important;
      }
      
      video:fullscreen {
        object-fit: contain !important;
      }
    }
    
    /* 视频加载指示器 */
    .video-loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 5; color: white; font-size: 2rem;
    }
    .video-loading i { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 深色模式 */
    body.dark-mode .video-wrapper { background: rgba(22,33,62,0.95) !important; }
    body.dark-mode .video-info h2 { color: var(--dk-text); }
    body.dark-mode .meta-item { color: var(--dk-muted); }
    body.dark-mode .meta-item i { color: #667eea; }
    body.dark-mode .description { color: var(--dk-muted); border-top-color: var(--dk-border); }
    body.dark-mode .related-videos { background: rgba(22,33,62,0.95) !important; }
    body.dark-mode .related-videos h3 { color: var(--dk-text); border-left-color: #667eea; }
    body.dark-mode .video-card { background: var(--dk-surface); }
    body.dark-mode .video-card .text-muted { color: var(--dk-muted) !important; }
    body.dark-mode .video-card .fw-bold { color: var(--dk-text); }
    body.dark-mode .pagination-btn { background: linear-gradient(135deg,#667eea,#764ba2); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      #playButtonOverlay:hover i,
      .video-card:hover,
      .video-card:hover img,
      .pagination-btn:hover:not(:disabled),
      .control-btn:hover {
        transform: none !important;
      }

      .video-loading i {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 (由 components.js 注入) -->
  <div id="navbar-placeholder"></div>

  <div class="player-main-layout">
    <!-- 左侧区域 -->
    <div class="player-left-col">
      <div class="video-wrapper">
        <div class="video-container" id="videoContainer">
          <div id="videoPlaceholder" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; display: flex; align-items: center; justify-content: center; z-index: 1;">
            <div id="coverImageContainer" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
              <img id="coverImage" src="" alt="视频封面" style="max-width: 100%; max-height: 100%; object-fit: contain; display: none;">
            </div>
            <div id="playButtonOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2;">
              <i class="fas fa-play-circle" style="font-size: 5rem; color: rgba(255,255,255,0.8);"></i>
            </div>
          </div>
          <video id="customPlayer" playsinline webkit-playsinline allowfullscreen style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0;">
            <!-- 这里将动态插入视频源 -->
          </video>
          <div class="custom-controls">
            <button id="playPauseBtn" class="control-btn" title="播放/暂停 (空格)">
              <i class="fas fa-play"></i>
            </button>
            <div class="time-display">
              <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
            </div>
            <div class="progress-container" id="progressContainer">
              <div class="progress" id="progress"></div>
              <div class="progress-buffer" id="progressBuffer"></div>
            </div>
            <div class="volume-container">
              <button id="volumeBtn" class="control-btn" title="静音 (M)">
                <i class="fas fa-volume-up"></i>
              </button>
              <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
            <button id="fullscreenBtn" class="control-btn fullscreen-btn" title="全屏 (F)">
              <i class="fas fa-expand"></i>
            </button>
          </div>
        </div>
        <div class="video-info">
          <h2 id="videoTitle">加载中...</h2>
          <div class="meta-row">
            <div class="meta-item"><i class="fas fa-user"></i><span id="videoArtist">-</span></div>
            <div class="meta-item"><i class="fas fa-compact-disc"></i><span id="videoAlbum">-</span></div>
          </div>
          <div class="description" id="videoDescription"></div>
        </div>
      </div>
    </div>

    <!-- 右侧区域 -->
    <div class="player-right-col">
      <div class="related-videos">
        <h3 class="mb-3" style="font-size: 1.1rem; border-left: 4px solid #0d6efd; padding-left: 10px;">📺 视频列表</h3>
        <div class="pagination-controls" id="paginationControls"></div>
        <div class="row" id="relatedVideos"></div>
      </div>
    </div>
  </div>

  <!-- 组件注入必须最先加载 -->
  <script src="components.js"></script>
  <script src="videos/video_data.js"></script>
  <script>
    var currentPage = 0;
    var videosPerPage = 8;
    var allRelatedVideos = [];
    var isPlaying = false;

    function getUrlParameter(name) {
      var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
      return results ? decodeURIComponent(results[1]) : null;
    }

    function readVideoStorageValue(key, fallback) {
      try {
        var value = localStorage.getItem(key);
        return value == null ? fallback : value;
      } catch (error) {
        return fallback;
      }
    }

    function writeVideoStorageValue(key, value) {
      try {
        localStorage.setItem(key, String(value));
      } catch (error) {
      }
    }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return min + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function splitArtistNamesLocal(value) {
      return String(value || '')
        .split(/[、，,\s]+/)
        .map(function(name) { return name.trim(); })
        .filter(Boolean);
    }

    function setVideoPlayerImage(image, url) {
      if (!image) return;
      var value = String(url || '').trim().replace(/&amp;/g, '&');
      image.src = /^https?:\/\//i.test(value) || value.indexOf('//') === 0 || value.indexOf('./') === 0 || value.indexOf('/') === 0
        ? value
        : './images/avatar.jpg';
      image.referrerPolicy = 'no-referrer';
      image.loading = 'lazy';
      image.decoding = 'async';
    }

    function renderArtistLinksLocal(element, artistValue) {
      if (!element) return;

      var names = splitArtistNamesLocal(artistValue);
      element.innerHTML = '';

      if (!names.length) {
        element.textContent = String(artistValue || '未知艺术家').trim() || '未知艺术家';
        return;
      }

      names.forEach(function(name, index) {
        if (index > 0) {
          element.appendChild(document.createTextNode('、'));
        }
        var link = document.createElement('a');
        link.href = 'artist.html?name=' + encodeURIComponent(name);
        link.className = 'artist-link';
        link.textContent = name;
        element.appendChild(link);
      });
    }

    function updateProgress() {
      const video = document.getElementById('customPlayer');
      const progress = document.getElementById('progress');
      const currentTimeEl = document.getElementById('currentTime');
      
      const percentage = (video.currentTime / video.duration) * 100;
      progress.style.width = percentage + '%';
      currentTimeEl.textContent = formatTime(video.currentTime);
    }

    function setVideoProgressFromClientX(clientX) {
      const video = document.getElementById('customPlayer');
      const progressContainer = document.getElementById('progressContainer');
      const progress = document.getElementById('progress');
      if (!video || !progressContainer || !video.duration) return;
      const rect = progressContainer.getBoundingClientRect();
      const width = rect.width || progressContainer.clientWidth || 1;
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / width));
      video.currentTime = ratio * video.duration;
      if (progress) progress.style.width = (ratio * 100) + '%';
    }

    function setProgress(e) {
      const clientX = e && typeof e.clientX === 'number' ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      setVideoProgressFromClientX(clientX);
    }

    function updatePlayButton() {
      const playPauseBtn = document.getElementById('playPauseBtn');
      const video = document.getElementById('customPlayer');
      const icon = playPauseBtn.querySelector('i');
      
      if (video.paused) {
        icon.className = 'fas fa-play';
        isPlaying = false;
      } else {
        icon.className = 'fas fa-pause';
        isPlaying = true;
      }
    }

    function togglePlay() {
      const video = document.getElementById('customPlayer');
      
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function updateVolume() {
      const video = document.getElementById('customPlayer');
      const volumeSlider = document.getElementById('volumeSlider');
      const volumeBtn = document.getElementById('volumeBtn');
      const volumeIcon = volumeBtn.querySelector('i');
      
      video.volume = volumeSlider.value;
      
      // 保存音量到 localStorage
      writeVideoStorageValue('videoVolume', volumeSlider.value);
      
      // 更新音量图标
      if (video.volume === 0) {
        volumeIcon.className = 'fas fa-volume-mute';
      } else if (video.volume < 0.5) {
        volumeIcon.className = 'fas fa-volume-down';
      } else {
        volumeIcon.className = 'fas fa-volume-up';
      }
    }

    function toggleFullscreen() {
      const video = document.getElementById('customPlayer');
      const videoContainer = document.getElementById('videoContainer');
      if (!video || !videoContainer) return;
      
      // 检查当前是否为全屏状态
      const isInFullscreen = document.fullscreenElement || 
                            document.webkitFullscreenElement || 
                            document.mozFullScreenElement || 
                            document.msFullscreenElement ||
                            videoContainer.classList.contains('is-faux-fullscreen');
      
      if (!isInFullscreen) {
        // 尝试进入全屏模式
        if (videoContainer.requestFullscreen) {
          // 标准全屏API：让整个容器全屏，保留自定义控制栏
          videoContainer.requestFullscreen().catch(e => {
            console.warn("标准全屏API失败:", e);
            // 尝试Webkit版本（Safari/iOS）
            if (video.webkitEnterFullscreen) {
              // iOS Safari 特有的全屏方法
              video.webkitEnterFullscreen();
            } else {
              attemptFallbackFullscreen(videoContainer);
            }
          });
        } else if (video.webkitEnterFullscreen) {
          // iOS Safari 特有的全屏方法 - 这对于移动端非常重要
          video.webkitEnterFullscreen();
        } else if (video.mozRequestFullScreen) {
          // Firefox
          video.mozRequestFullScreen();
        } else if (video.msRequestFullscreen) {
          // IE/Edge
          video.msRequestFullscreen();
        } else {
          // 尝试备用方法
          attemptFallbackFullscreen(videoContainer);
        }
      } else {
        // 退出全屏模式
        videoContainer.classList.remove('is-faux-fullscreen');
        document.body.classList.remove('video-faux-fullscreen');
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozFullScreenElement && document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.msFullscreenElement && document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }

    // 尝试备用全屏方法
    function attemptFallbackFullscreen(element) {
      const video = document.getElementById('customPlayer');
      if (video && video.webkitEnterFullscreen) {
        // iOS Safari
        video.webkitEnterFullscreen();
      } else if (element.requestFullscreen) {
        element.requestFullscreen().catch(function() {
          element.classList.add('is-faux-fullscreen');
          document.body.classList.add('video-faux-fullscreen');
        });
      } else if (element.mozRequestFullScreen) {
        element.mozRequestFullScreen();
      } else if (element.msRequestFullscreen) {
        element.msRequestFullscreen();
      } else {
        element.classList.add('is-faux-fullscreen');
        document.body.classList.add('video-faux-fullscreen');
      }
    }
    
    // 为iframe播放器更新全屏函数
    function updateFullscreenFunctionForIframe() {
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      if(fullscreenBtn) {
        // 移除旧的事件监听器
        const newFullscreenBtn = fullscreenBtn.cloneNode(true);
        fullscreenBtn.parentNode.replaceChild(newFullscreenBtn, fullscreenBtn);
        
        // 添加新的事件监听器
        newFullscreenBtn.addEventListener('click', toggleIframeFullscreen);
      }
    }
    
    // 专门针对iframe的全屏切换函数
    function toggleIframeFullscreen() {
      const iframe = document.getElementById('bilibili-player');
      if(!iframe) {
        // 如果不是iframe，回退到原始全屏功能
        toggleFullscreen();
        return;
      }
      
      // 对于iframe，我们依赖其内部的全屏功能
      // 在移动端，大多数情况下需要用户与iframe内的播放器直接交互才能触发全屏
      alert("请直接点击视频画面内部的全屏按钮来进入全屏模式。移动端浏览器通常需要在iframe内部触发全屏。");
    }

    function renderPlayer(video) {
      const container = document.getElementById('videoContainer');
      const videoElement = document.getElementById('customPlayer');
      const coverImage = document.getElementById('coverImage');
      const playButtonOverlay = document.getElementById('playButtonOverlay');
      const videoPlaceholder = document.getElementById('videoPlaceholder');
      
      // 重置播放器
      if(video.src.includes('bilibili.com')) {
        // 对于B站视频，仍然使用iframe，不使用自定义控件
        let bvid = video.src.match(/bvid=([a-zA-Z0-9]+)/)[1];
        // 不替换整个容器，而是替换video元素
        const iframeHTML = `<iframe id="bilibili-player" src="//player.bilibili.com/player.html?bvid=${bvid}&autoplay=1" frameborder="0" allowfullscreen webkitallowfullscreen mozallowfullscreen style="width:100%; height:100%; position: absolute; top: 0; left: 0;"></iframe>`;
        videoElement.outerHTML = iframeHTML;
        
        // 隐藏占位符元素
        if(videoPlaceholder) {
          videoPlaceholder.style.display = 'none';
        }
        
        // 为B站播放器添加全屏支持
        const bilibiliPlayer = document.getElementById('bilibili-player');
        if(bilibiliPlayer) {
          // 更新全屏函数以支持iframe
          updateFullscreenFunctionForIframe();
        }
      } else {
        // 设置封面图片
        coverImage.src = video.cover;
        coverImage.style.display = 'block';
        videoPlaceholder.style.display = 'flex';
        
        // 为封面图片添加点击事件以开始播放
        playButtonOverlay.onclick = function() {
          const videoElement = document.getElementById('customPlayer');
          videoElement.play().catch(e => {
            console.error("播放失败:", e);
            // 如果自动播放失败，可能需要用户手势才能播放
          });
        };
        
        // 对于普通视频，使用自定义控件
        videoElement.src = video.src;
        videoElement.load();
        
        // 确保视频元素可见
        videoElement.style.display = 'block';
        
        // 绑定事件
        videoElement.addEventListener('timeupdate', updateProgress);
        videoElement.addEventListener('loadedmetadata', function() {
          document.getElementById('totalTime').textContent = formatTime(videoElement.duration);
          document.getElementById('progressBuffer').style.width = '100%';
        });
        videoElement.addEventListener('play', function() {
          updatePlayButton();
          // 播放开始时隐藏封面
          if(videoPlaceholder) {
            videoPlaceholder.style.display = 'none';
          }
        });
        videoElement.addEventListener('pause', function() {
          updatePlayButton();
        });

        // 缓冲状态
        var loadingEl = document.createElement('div');
        loadingEl.className = 'video-loading';
        loadingEl.innerHTML = '<i class="fas fa-spinner"></i>';
        loadingEl.style.display = 'none';
        container.appendChild(loadingEl);

        videoElement.addEventListener('waiting', function() {
          loadingEl.style.display = 'block';
        });
        videoElement.addEventListener('playing', function() {
          loadingEl.style.display = 'none';
        });
        videoElement.addEventListener('canplay', function() {
          loadingEl.style.display = 'none';
        });
        videoElement.addEventListener('ended', function() {
          updatePlayButton();
          // 自动播放下一个视频
          var nextVideo = allRelatedVideos.find(function(v) { return v.id != video.id; });
          if (nextVideo) {
            window.location.href = 'video-player.html?id=' + nextVideo.id + '&autoplay=true';
          } else {
            if(videoPlaceholder) {
              videoPlaceholder.style.display = 'flex';
              coverImage.style.display = 'block';
            }
          }
        });
        
        // 添加全屏事件监听器
        videoElement.addEventListener('webkitbeginfullscreen', function() {
          // iOS设备进入全屏时的处理
          console.log("Entering fullscreen on iOS");
        });
        
        videoElement.addEventListener('webkitendfullscreen', function() {
          // iOS设备退出全屏时的处理
          console.log("Exiting fullscreen on iOS");
        });
      }
      
      document.title = video.title + " - 丽江音悦台";
      document.getElementById('videoTitle').innerText = video.title;
      renderArtistLinksLocal(document.getElementById('videoArtist'), video.artist);
      document.getElementById('videoAlbum').innerText = video.album || '默认专辑';
      document.getElementById('videoDescription').innerText = video.description || '暂无描述';
    }

    function renderList() {
      const list = document.getElementById('relatedVideos');
      list.innerHTML = '';
      let start = currentPage * videosPerPage;
      let end = start + videosPerPage;
      let currentVideos = allRelatedVideos.slice(start, end);
      let currentId = getUrlParameter('id');

      currentVideos.forEach(v => {
        var isActive = (v.id == currentId);
        var col = document.createElement('div');
        col.className = 'col-12 col-md-6 mb-3';
        var card = document.createElement('div');
        card.className = 'video-card h-100' + (isActive ? ' active-card' : '');
        card.addEventListener('click', function() {
          location.href = 'video-player.html?id=' + encodeURIComponent(String(v.id || '')) + '&page=' + currentPage;
        });
        var image = document.createElement('img');
        image.className = 'w-100';
        image.style.cssText = 'height:110px; object-fit:cover;';
        setVideoPlayerImage(image, v.cover);
        var body = document.createElement('div');
        body.className = 'p-2 small';
        var title = document.createElement('div');
        title.className = 'text-truncate fw-bold';
        title.textContent = v.title || '未命名视频';
        if (isActive) {
          var icon = document.createElement('i');
          icon.className = 'fas fa-play-circle text-primary';
          icon.style.fontSize = '0.7rem';
          title.appendChild(document.createTextNode(' '));
          title.appendChild(icon);
        }
        var artist = document.createElement('div');
        artist.className = 'text-muted text-truncate';
        artist.textContent = splitArtistNamesLocal(v.artist).join('、') || String(v.artist || '未知艺术家');
        body.appendChild(title);
        body.appendChild(artist);
        card.appendChild(image);
        card.appendChild(body);
        col.appendChild(card);
        list.appendChild(col);
      });
      renderPagination();
    }

    function renderPagination() {
      const controls = document.getElementById('paginationControls');
      let totalPages = Math.ceil(allRelatedVideos.length / videosPerPage);
      controls.innerHTML = `
        <button class="pagination-btn" ${currentPage==0?'disabled':''} onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
        <span class="small text-muted">${currentPage+1} / ${totalPages}</span>
        <button class="pagination-btn" ${currentPage>=totalPages-1?'disabled':''} onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
      `;
    }

    function changePage(dir) {
      currentPage += dir;
      renderList();
    }

    window.onload = function() {
      let id = getUrlParameter('id');
      let savedPage = getUrlParameter('page');
      if (savedPage !== null) {
        currentPage = parseInt(savedPage);
      }
      
      // 深色模式
      if (readVideoStorageValue('ljyyt_dark_mode', 'false') === 'true') {
        document.body.classList.add('dark-mode');
      }
      var searchForm = document.getElementById('search-form');
      if (searchForm) {
        var darkBtn = document.createElement('button');
        darkBtn.type = 'button';
        darkBtn.className = 'btn btn-outline-light btn-sm';
        darkBtn.style.cssText = 'border-radius:50%;width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:0.9rem;margin-left:12px;flex-shrink:0';
        var isDark = document.body.classList.contains('dark-mode');
        darkBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        darkBtn.onclick = function() {
          var d = document.body.classList.toggle('dark-mode');
          writeVideoStorageValue('ljyyt_dark_mode', d);
          this.innerHTML = d ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        };
        searchForm.appendChild(darkBtn);
      }

      // 绑定自定义控件事件
      document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
      document.getElementById('progressContainer').addEventListener('click', setProgress);
      document.getElementById('volumeSlider').addEventListener('input', updateVolume);
      document.getElementById('volumeBtn').addEventListener('click', function() {
        const video = document.getElementById('customPlayer');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = this.querySelector('i');
        if (video.volume > 0) {
          video.setAttribute('data-prev-volume', video.volume);
          video.volume = 0;
          volumeSlider.value = 0;
          volumeIcon.className = 'fas fa-volume-mute';
        } else {
          const prevVolume = video.getAttribute('data-prev-volume') || 1;
          video.volume = parseFloat(prevVolume);
          volumeSlider.value = prevVolume;
          volumeIcon.className = prevVolume < 0.5 ? 'fas fa-volume-down' : 'fas fa-volume-up';
        }
      });
      document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
      
      // 点击视频画面播放/暂停（双击全屏）
      var clickTimer = null;
      document.getElementById('videoContainer').addEventListener('click', function(e) {
        if (e.target.closest('.custom-controls') || e.target.closest('#playButtonOverlay')) return;
        var vid = document.getElementById('customPlayer');
        if (!vid || !vid.src) return;
        if (clickTimer) {
          // 双击
          clearTimeout(clickTimer);
          clickTimer = null;
          toggleFullscreen();
        } else {
          clickTimer = setTimeout(function() {
            clickTimer = null;
            togglePlay();
          }, 250);
        }
      });
      
      // 进度条拖拽
      (function() {
        var dragging = false;
        var pc = document.getElementById('progressContainer');
        function onStart(e) {
          if (!pc) return;
          dragging = true;
          e.preventDefault();
          pc.setPointerCapture?.(e.pointerId);
          setVideoProgressFromClientX(e.clientX);
        }
        function onMove(e) {
          if (!dragging) return;
          e.preventDefault();
          setVideoProgressFromClientX(e.clientX);
        }
        function onEnd(e) {
          if (!dragging) return;
          dragging = false;
          try { pc.releasePointerCapture?.(e.pointerId); } catch (error) {}
        }
        pc.addEventListener('pointerdown', onStart);
        pc.addEventListener('pointermove', onMove);
        pc.addEventListener('pointerup', onEnd);
        pc.addEventListener('pointercancel', onEnd);
      })();

      document.addEventListener('fullscreenchange', function() {
        var container = document.getElementById('videoContainer');
        if (!document.fullscreenElement && container) {
          container.classList.remove('is-faux-fullscreen');
          document.body.classList.remove('video-faux-fullscreen');
        }
      });
      
      // 键盘快捷键
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        var vid = document.getElementById('customPlayer');
        if (!vid) return;
        switch(e.code) {
          case 'Space': e.preventDefault(); togglePlay(); break;
          case 'ArrowRight': e.preventDefault(); if(vid.duration) vid.currentTime = Math.min(vid.currentTime + 5, vid.duration); break;
          case 'ArrowLeft': e.preventDefault(); vid.currentTime = Math.max(vid.currentTime - 5, 0); break;
          case 'ArrowUp': e.preventDefault(); vid.volume = Math.min(vid.volume + 0.1, 1); document.getElementById('volumeSlider').value = vid.volume; updateVolume(); break;
          case 'ArrowDown': e.preventDefault(); vid.volume = Math.max(vid.volume - 0.1, 0); document.getElementById('volumeSlider').value = vid.volume; updateVolume(); break;
          case 'KeyF': e.preventDefault(); toggleFullscreen(); break;
        }
      });
      
      // 恢复音量
      var savedVolume = readVideoStorageValue('videoVolume', null);
      if (savedVolume !== null) {
        var volumeSlider = document.getElementById('volumeSlider');
        var videoEl = document.getElementById('customPlayer');
        volumeSlider.value = savedVolume;
        videoEl.volume = parseFloat(savedVolume);
        var volumeIcon = document.getElementById('volumeBtn').querySelector('i');
        if (videoEl.volume === 0) volumeIcon.className = 'fas fa-volume-mute';
        else if (videoEl.volume < 0.5) volumeIcon.className = 'fas fa-volume-down';
        else volumeIcon.className = 'fas fa-volume-up';
      }
      
      let video = videoData.find(v => v.id == id);
      if(video) {
        renderPlayer(video);
        allRelatedVideos = videoData.filter(v => v.id != id);
        renderList();
        
        // 自动播放（从上一个视频跳转过来）
        if (getUrlParameter('autoplay') === 'true') {
          setTimeout(function() {
            var vid = document.getElementById('customPlayer');
            if (vid && vid.src) {
              vid.play().catch(function() {});
            } else {
              var overlay = document.getElementById('playButtonOverlay');
              if (overlay) overlay.click();
            }
          }, 500);
        }
      } else {
        // 视频不存在
        document.getElementById('videoTitle').innerText = '视频不存在';
        document.getElementById('videoDescription').innerHTML = '<div class="text-center py-4"><i class="fas fa-exclamation-triangle fa-3x mb-3" style="color:#ffc107"></i><p class="text-muted">找不到该视频，请返回<a href="index.html" class="text-primary">首页</a>重新选择。</p></div>';
        document.title = '视频不存在 - 丽江音悦台';
        // 仍然显示视频列表
        allRelatedVideos = videoData;
        renderList();
      }
    }
  </script>
</body>
</html>
