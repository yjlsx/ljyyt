    .search-results-title.video-title {

    /* 筛选标签 */
    .filter-tab {

    }
    .filter-tab:hover {

    /* 搜索结果容器 */

    /* 卡片进入动画 */

    /* 音乐/视频卡片基础 */
    .music-card, .video-card {

      transition: transform 0.2s, box-shadow 0.2s;

<body>
    <!-- 导航栏 (由 components.js 注入) -->
    <div id="navbar-placeholder"></div>

  <!-- 搜索横幅 -->
  <header class="search-hero py-5">
    <div class="container text-center text-white">
      <h1 class="display-4 fw-bold">搜索结果</h1>
      <p class="lead" id="search-hero-query">传承纳西文化，分享民族音乐之美</p>
      <div class="mt-4">
        <div class="input-group w-50 mx-auto">
          <input type="text" class="form-control form-control-lg" id="hero-search-input" placeholder="搜索音乐..." aria-label="搜索">

  </header>

  <!-- 搜索结果内容 -->
  <section class="search-container" style="padding: 20px 0;">
    <div class="container">
      <!-- 筛选标签 -->
      <div class="search-filter-tabs d-flex justify-content-center gap-2 mb-4">
        <button class="filter-tab active" data-filter="all" type="button">
          <i class="fas fa-th-large me-1"></i> 全部
        </button>
        <button class="filter-tab" data-filter="music" type="button">
          <i class="fas fa-music me-1"></i> 音乐
        </button>
        <button class="filter-tab" data-filter="video" type="button">
          <i class="fas fa-video me-1"></i> 视频
        </button>
      </div>

      <div class="search-results-box">
        <!-- 搜索统计 -->
        <div class="alert alert-info mb-4" id="search-stats" style="display: none;">
          找到 <span id="total-count">0</span> 个结果 (<span id="music-count">0</span> 首音乐, <span id="video-count">0</span> 个视频)
        </div>
        
        <!-- 音乐结果 -->
        <div id="music-section">
          <h3 class="search-results-title music-title">
            <i class="fas fa-music me-2"></i>音乐
          </h3>
          <div class="row" id="music-results">
            <!-- 音乐结果将通过JavaScript动态生成 -->
          </div>
        </div>
        
        <!-- 视频结果 -->
        <div id="video-section">
          <h3 class="search-results-title video-title mt-4">
            <i class="fas fa-video me-2"></i>视频
          </h3>
          <div class="row" id="video-results">
            <!-- 视频结果将通过JavaScript动态生成 -->
          </div>
        </div>
        
        <!-- 无结果提示 -->
        <div class="text-center py-5 no-results-box" id="no-results" style="display: none;">
          <i class="fas fa-search fa-3x mb-3" style="color: #667eea; opacity: 0.4;"></i>
          <h5 class="mt-3 mb-2" style="color: #555;">未找到相关结果</h5>
          <p class="text-muted small">换个关键词试试吧</p>

  </section>

  <!-- 页脚 -->
  <footer class="bg-dark text-white py-4">
    <div class="container text-center">
      <p>&copy; 2026 丽江音悦台. 保留所有权利.</p>

  <!-- 底部播放器 (由 components.js 注入) -->
  <div id="player-placeholder"></div>

  <!-- Bootstrap JS -->
  <!-- 组件注入必须最先加载 -->
  <script src="components.js?v=20260526-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="videos/video_data.js"></script>
  <script src="site-config.js?v=20260526-1"></script>
  <script src="script.js?v=20260526-1"></script>
  <script src="player_state.js"></script>
  <script src="player_enhanced.js?v=20260526-1"></script>
  
  <script>
    console.log('🔍 搜索页面加载');

    // 获取URL参数
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // 格式化时间
    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '00:00';
      var min = Math.floor(seconds / 60);
      var sec = Math.floor(seconds % 60);
      return (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function buildArtistLinksHtml(artistValue) {
      var names = (typeof splitArtistNames === 'function')
        ? splitArtistNames(artistValue)
        : String(artistValue || '').split(/[、，,\s]+/).filter(Boolean);

      if (!names.length) {
        return escapeHtml(String(artistValue || '未知艺术家').trim() || '未知艺术家');
      }

      return names.map(function(name) {
        var safeName = escapeHtml(name);
        return '<a href="artist.html?name=' + encodeURIComponent(name) + '" class="artist-link" onclick="event.stopPropagation()">' + safeName + '</a>';
      }).join('、');
    }

    // 搜索函数
    function search(query) {
      query = query.toLowerCase().trim();
      if (!query) {
        return { music: [], video: [] };
      }

      var results = { music: [], video: [] };

      // 搜索音乐
      if (typeof musicData !== 'undefined') {
        results.music = musicData.filter(function(track) {
          return track.title.toLowerCase().indexOf(query) !== -1 ||
                 track.artist.toLowerCase().indexOf(query) !== -1;
        });
      }

      // 搜索视频
      if (typeof videoData !== 'undefined') {
        results.video = videoData.filter(function(video) {
          return video.title.toLowerCase().indexOf(query) !== -1 ||
                 video.artist.toLowerCase().indexOf(query) !== -1 ||
                 (video.description && video.description.toLowerCase().indexOf(query) !== -1);
        });
      }

      return results;
    }

    // 当前筛选状态
    var currentFilter = 'all';
    var currentResults = { music: [], video: [] };

    // 显示搜索结果
    function displayResults(results) {
      currentResults = results;
      var musicContainer = document.getElementById('music-results');
      var videoContainer = document.getElementById('video-results');
      var noResultsDiv = document.getElementById('no-results');
      var searchStats = document.getElementById('search-stats');
      var totalCount = document.getElementById('total-count');
      var musicCount = document.getElementById('music-count');
      var videoCount = document.getElementById('video-count');

      // 更新计数
      var total = results.music.length + results.video.length;
      totalCount.textContent = total;
      musicCount.textContent = results.music.length;
      videoCount.textContent = results.video.length;

      // 显示统计信息
      searchStats.style.display = total > 0 ? 'block' : 'none';

      // 渲染音乐结果
      if (results.music.length > 0) {
        var musicHtml = '';
        results.music.forEach(function(track, index) {
          musicHtml += '<div class="col-md-6 col-lg-3 mb-3 card-enter" style="animation-delay: ' + (index * 0.05) + 's">' +
            '<div class="card music-card" data-id="' + track.id + '">' +
            '<div class="card-body d-flex align-items-center p-2">' +
            '<img src="' + (track.cover || './images/avatar.jpg') + '" alt="' + escapeHtml(track.title) + '" class="album-cover me-2" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\'./images/avatar.jpg\'">' +
            '<div class="flex-grow-1 overflow-hidden">' +
            '<h6 class="card-title mb-1 text-truncate" title="' + track.title + '">' + track.title + '</h6>' +
            '<div class="d-flex align-items-center">' +
            '<p class="card-text text-muted mb-0 small text-truncate me-2" title="' + track.artist + '">' + buildArtistLinksHtml(track.artist) + '</p>' +
            '<small class="text-muted track-duration">' + formatTime(track.duration) + '</small>' +
            '</div></div>' +
            '<i class="fas fa-music text-primary ms-2 card-music-icon"></i>' +
            '</div></div></div>';
        });
        musicContainer.innerHTML = musicHtml;

        // 绑定音乐卡片点击
        document.querySelectorAll('.music-card').forEach(function(card) {
          card.addEventListener('click', function() {
            var trackId = parseInt(this.getAttribute('data-id'));
            console.log('🎵 点击了音乐卡片 ID:', trackId);
            playMusicById(trackId);
          });
        });
      } else {
        musicContainer.innerHTML = '<p class="text-muted">未找到相关音乐</p>';
      }

      // 渲染视频结果
      if (results.video.length > 0) {
        var videoHtml = '';
        results.video.forEach(function(track, index) {
          videoHtml += '<div class="col-md-6 col-lg-4 mb-4 card-enter" style="animation-delay: ' + (index * 0.05) + 's">' +
            '<div class="card video-card" data-id="' + track.id + '">' +
            '<div class="card-body p-0">' +
            '<div class="position-relative">' +
            '<img src="' + (track.cover || './images/avatar.jpg') + '" alt="' + escapeHtml(track.title) + '" class="card-img-top" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\'./images/avatar.jpg\'">' +
            '<div class="position-absolute top-50 start-50 translate-middle">' +
            '<i class="fas fa-play-circle text-white" style="font-size: 3rem; opacity: 0.8;"></i>' +
            '</div>' +
            '<div class="position-absolute bottom-0 start-0 end-0 p-2" style="background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);">' +
            '<span class="text-white small">' + formatTime(track.duration) + '</span>' +
            '</div></div></div>' +
            '<div class="p-3">' +
            '<h6 class="card-title mb-1">' + track.title + '</h6>' +
            '<p class="card-text text-muted mb-0 small">' + buildArtistLinksHtml(track.artist) + '</p>' +
            '</div></div></div>';
        });
        videoContainer.innerHTML = videoHtml;

        // 绑定视频卡片点击
        document.querySelectorAll('.video-card').forEach(function(card) {
          card.addEventListener('click', function() {
            var videoId = parseInt(this.getAttribute('data-id'));
            console.log('🎬 点击了视频卡片 ID:', videoId);
            window.location.href = 'video-player.html?id=' + videoId + '&autoplay=true';
          });
        });
      } else {
        videoContainer.innerHTML = '<p class="text-muted">未找到相关视频</p>';
      }

      // 显示/隐藏无结果提示
      noResultsDiv.style.display = total === 0 ? 'block' : 'none';

      // 应用当前筛选
      applyFilter(currentFilter);
    }

    // 应用筛选
    function applyFilter(filter) {
      currentFilter = filter;
      var musicSection = document.getElementById('music-section');
      var videoSection = document.getElementById('video-section');

      if (filter === 'all') {
        musicSection.style.display = currentResults.music.length > 0 ? '' : 'none';
        videoSection.style.display = currentResults.video.length > 0 ? '' : 'none';
      } else if (filter === 'music') {
        musicSection.style.display = '';
        videoSection.style.display = 'none';
      } else if (filter === 'video') {
        musicSection.style.display = 'none';
        videoSection.style.display = '';
      }
    }

    // 根据ID播放音乐
    function playMusicById(id) {
      var track = musicData.find(function(t) { return t.id === id; });
      if (!track) return;

      console.log('🎵 开始播放音乐:', track.title);
      currentTrackIndex = musicData.findIndex(function(t) { return t.id === id; });
      isPlaying = true;

      // 更新底部播放器UI
      document.getElementById('current-title').textContent = track.title;
      if (typeof setArtistElementContent === 'function') {
        setArtistElementContent(document.getElementById('current-artist'), track.artist, false);
      } else {
        document.getElementById('current-artist').textContent = track.artist;
      }
      document.getElementById('current-cover').src = track.cover || './images/avatar.jpg';

      // 检查是否同一首歌
      var isSameTrack = false;
      try {
        var currentSrc = new URL(audioPlayer.src).href;
        var trackSrc = new URL(track.src, window.location.href).href;
        isSameTrack = currentSrc === trackSrc;
      } catch(e) {}

      if (!isSameTrack) {
        audioPlayer.src = track.src;

        // 恢复播放进度
        try {
          var savedState = JSON.parse(localStorage.getItem('playerState'));
          if (savedState && savedState.trackId === track.id && savedState.currentTime > 0) {
            audioPlayer.addEventListener('loadedmetadata', function onMeta() {
              audioPlayer.removeEventListener('loadedmetadata', onMeta);
              audioPlayer.currentTime = savedState.currentTime;
            });
          }
        } catch(e) {}
      }

      // 恢复音量
      try {
        var savedState = JSON.parse(localStorage.getItem('playerState'));
        if (savedState && savedState.volume !== undefined) {
          audioPlayer.volume = savedState.volume;
          if (volumeSlider) volumeSlider.value = savedState.volume;
        }
      } catch(e) {}

      // 播放
      audioPlayer.play().then(function() {
        isPlaying = true;
        updatePlayButton();
        if (typeof savePlayerState === 'function') {
          savePlayerState(track.id, audioPlayer.currentTime, isPlaying, track, audioPlayer.volume);
        }
      }).catch(function(error) {
        console.error('❌ 播放失败:', error);
        isPlaying = false;
        updatePlayButton();
      });

      updatePlayButton();
    }

    // 执行搜索
    function performSearch(query) {
      console.log('🔍 开始搜索:', query);

      // 更新横幅
      var heroQuery = document.getElementById('search-hero-query');
      if (heroQuery) {
        heroQuery.innerHTML = '正在搜索 "<span class="search-query-text">' + query.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span>" 的结果';
      }

      setTimeout(function() {
        try {
          var results = search(query);
          console.log('✅ 搜索完成: 音乐', results.music.length, '个, 视频', results.video.length, '个');
          displayResults(results);
        } catch (error) {
          console.error('❌ 搜索失败:', error);
          alert('搜索失败: ' + error.message);
        }
      }, 100);
    }

    // === 页面初始化（单个 DOMContentLoaded） ===
    document.addEventListener('DOMContentLoaded', function() {
      console.log('✅ 搜索页面 DOM 加载完成');

      // 1. 恢复播放器状态
      if (!window._playerStateRestored && typeof restorePlayerState === 'function' && typeof hasSavedPlayerState === 'function' && hasSavedPlayerState()) {
        try {
          var savedState = restorePlayerState();
          if (savedState && savedState.trackData) {
            console.log('🔄 恢复播放器状态:', savedState.trackData.title);
            var trackIndex = musicData.findIndex(function(t) { return t.id === savedState.trackId; });
            if (trackIndex !== -1) {
              currentTrackIndex = trackIndex;
              document.getElementById('current-title').textContent = savedState.trackData.title;
              if (typeof setArtistElementContent === 'function') {
                setArtistElementContent(document.getElementById('current-artist'), savedState.trackData.artist, false);
              } else {
                document.getElementById('current-artist').textContent = savedState.trackData.artist;
              }
              document.getElementById('current-cover').src = savedState.trackData.cover;
              audioPlayer.src = savedState.trackData.src;

              if (savedState.volume !== undefined) {
                audioPlayer.volume = savedState.volume;
                if (volumeSlider) volumeSlider.value = savedState.volume;
              }

              audioPlayer.addEventListener('loadedmetadata', function onMeta() {
                audioPlayer.removeEventListener('loadedmetadata', onMeta);
                audioPlayer.currentTime = savedState.currentTime;
                if (savedState.isPlaying) {
                  audioPlayer.play().then(function() {
                    isPlaying = true;
                    updatePlayButton();
                  }).catch(function() {
                    isPlaying = false;
                    updatePlayButton();
                  });
                }
              });
            }
          }
        } catch (error) {
          console.error('❌ 恢复播放器状态出错:', error);
        }
      }

      // 2. 等待数据加载后执行搜索
      var navForm = document.querySelector('.navbar-search-form');
      var navInput = navForm ? navForm.querySelector('input[name="q"]') : null;
      var checkDataInterval = setInterval(function() {
        if (typeof musicData !== 'undefined' && typeof videoData !== 'undefined') {
          clearInterval(checkDataInterval);
          console.log('✅ 数据加载完成: 音乐', musicData.length, '首, 视频', videoData.length, '个');

          var query = getUrlParameter('q');
          if (query) {
            document.getElementById('hero-search-input').value = query;
            if (navInput) navInput.value = query;
            performSearch(query);
          }
        }
      }, 100);

      // 数据加载超时检查
      setTimeout(function() {
        if (typeof musicData === 'undefined' || typeof videoData === 'undefined') {
          console.error('❌ 数据加载超时');
          var stats = document.getElementById('search-stats');
          stats.innerHTML = '<p class="text-danger">数据加载失败，请刷新页面重试</p>';
          stats.style.display = 'block';
        }
      }, 5000);

      // 3. 搜索按钮和键盘事件
      function saveAndSearch(query) {
        if (!query) return;
        // 保存播放状态
        if (typeof isPlaying !== 'undefined' && typeof audioPlayer !== 'undefined' && audioPlayer && typeof musicData !== 'undefined' && musicData[currentTrackIndex]) {
          savePlayerState(musicData[currentTrackIndex].id, audioPlayer.currentTime, isPlaying, musicData[currentTrackIndex], audioPlayer.volume);
        }
        window.location.href = 'search.html?q=' + encodeURIComponent(query);
      }

      document.getElementById('search-btn').addEventListener('click', function() {
        saveAndSearch(document.getElementById('hero-search-input').value.trim());
      });

      document.getElementById('hero-search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveAndSearch(this.value.trim());
        }
      });

      // 导航栏搜索
      if (navForm && navInput) {
        navForm.addEventListener('submit', function(e) {
          e.preventDefault();
          saveAndSearch(navInput.value.trim());
        });
      }

      // 4. 筛选标签切换
      document.querySelectorAll('.filter-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          // 更新 active 状态
          document.querySelectorAll('.filter-tab').forEach(function(t) {
            t.classList.remove('active');
          });
          this.classList.add('active');

          // 应用筛选
          var filter = this.getAttribute('data-filter');
          console.log('🏷️ 切换筛选:', filter);
          applyFilter(filter);
        });
      });

      console.log('✅ 搜索页面初始化完成');
    });
  </script>

  <!-- 向上火箭按钮 -->
  <button id="scrollToTopBtn" class="scroll-to-top" onclick="scrollToTop()" aria-label="返回顶部">
    <i class="fas fa-rocket"></i>
  </button>

  <script>
    // 滚动到顶部
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      var btn = document.getElementById('scrollToTopBtn');
      if (btn) {
        btn.style.transform = 'translateY(-20px)';
        setTimeout(function() { btn.style.transform = ''; }, 300);
      }
    }

    function updateRocketButton() {
      var btn = document.getElementById('scrollToTopBtn');
      if (btn) {
        var pos = window.pageYOffset || document.documentElement.scrollTop;
        if (pos > 300) {
          btn.classList.add('show');
        } else {
          btn.classList.remove('show');
        }
      }
    }

    window.addEventListener('scroll', updateRocketButton);
    document.addEventListener('DOMContentLoaded', function() {
      updateRocketButton();
    });
  </script>
</body>
</html>
