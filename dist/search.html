<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="丽江音悦台搜索 - 搜索纳西音乐、歌单、MV 视频和聚合音源">
  <meta name="robots" content="noindex">
  <title>丽江音悦台</title>
  <link rel="icon" href="./images/avatar.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="./images/avatar.jpg">
  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <link rel="stylesheet" href="css/search-app.css">
</head>
<body class="search-page discovery-mode">
  <main class="search-app" aria-label="发现">
    <header class="discover-app-header">
      <div>
        <h1>发现</h1>
        <p>搜索歌曲、歌手、专辑和歌单</p>
      </div>
      <button class="discover-theme-toggle" id="theme-toggle" type="button" data-theme-toggle data-theme-icon-only="true" aria-label="切换深色模式">
        <span data-icon="moon"></span>
      </button>
    </header>

    <section class="discover-search-card" aria-label="搜索">
      <form class="search-form discover-search-form" id="search-form" action="search.html" method="GET" role="search">
        <div class="source-picker sr-only" id="source-picker" aria-hidden="true">
          <button class="source-button" id="source-button" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span data-icon="radio"></span>
            <span id="source-label">聚合搜索</span>
            <span data-icon="chevronDown"></span>
          </button>
          <div class="source-menu" id="source-menu" role="listbox" aria-label="选择搜索来源">
            <button class="source-option active" type="button" data-source="aggregate"><span><strong>聚合搜索</strong><br><small>丽江曲库 + 已启用音源</small></span><span data-icon="check"></span></button>
            <button class="source-option" type="button" data-source="local"><span><strong>丽江曲库</strong><br><small>本站纳西音乐和视频</small></span><span data-icon="database"></span></button>
            <button class="source-option" type="button" data-source="joox"><span><strong>Joox</strong><br><small>海外华语/流行音乐源</small></span><span data-icon="globe"></span></button>
            <button class="source-option" type="button" data-source="netease"><span><strong>网易云</strong><br><small>小众音乐匹配较多</small></span><span data-icon="music"></span></button>
            <button class="source-option" type="button" data-source="kuwo"><span><strong>酷我</strong><br><small>曲库覆盖较广</small></span><span data-icon="headphones"></span></button>
            <button class="source-option" type="button" data-source="migu"><span><strong>Migu</strong><br><small>咪咕音乐来源</small></span><span data-icon="radio"></span></button>
            <button class="source-option" type="button" data-source="bilibili"><span><strong>B站</strong><br><small>用户上传音乐内容</small></span><span data-icon="video"></span></button>
            <button class="source-option" type="button" data-source="_netease"><span><strong>Netease</strong><br><small>网易云备用接口</small></span><span data-icon="refresh"></span></button>
          </div>
        </div>
        <label class="search-input-wrap" for="hero-search-input">
          <span data-icon="search"></span>
          <input type="search" id="hero-search-input" name="q" placeholder="搜索" aria-label="搜索" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="search">
        </label>
        <button class="search-submit" id="search-btn" type="submit" aria-label="搜索"><span data-icon="search"></span></button>
      </form>
      <div class="search-history" id="search-history" hidden>
        <span>搜索记录</span>
        <div class="history-list" id="history-list"></div>
        <button class="history-clear" id="history-clear" type="button">清空</button>
      </div>
    </section>

    <section class="discover-section" id="discover-section" aria-label="发现歌单">
      <div class="section-head discover-head">
        <div>
          <h2>歌单</h2>
          <p>播放列表、最近播放、喜欢和我的歌单。</p>
        </div>
      </div>
      <div class="discover-playlist-rail" id="discover-playlists"></div>
    </section>

    <nav class="result-tabs" aria-label="搜索结果分类">
      <button class="result-tab active" type="button" data-filter="all"><span data-icon="grid"></span>全部</button>
      <button class="result-tab" type="button" data-filter="music"><span data-icon="music"></span>歌曲</button>
      <button class="result-tab" type="button" data-filter="playlists"><span data-icon="album"></span>歌单</button>
      <button class="result-tab" type="button" data-filter="video"><span data-icon="video"></span>MV</button>
    </nav>

    <div class="search-status" id="search-status">发现音乐，或搜索歌曲。</div>

    <section class="search-section" id="music-section">
      <div class="section-head">
        <div>
          <h2>歌曲</h2>
          <p>点击播放。</p>
        </div>
      </div>
      <div class="track-list-app" id="music-results">
        <div class="empty-state"><strong>发现</strong><span>选择歌单或搜索歌曲。</span></div>
      </div>
    </section>

    <section class="search-section" id="playlist-section">
      <div class="section-head">
        <div>
          <h2>歌单</h2>
          <p>播放列表、最近播放、喜欢和曲库来源。</p>
        </div>
      </div>
      <div class="playlist-grid-app" id="playlist-results"></div>
    </section>

    <section class="search-section" id="video-section">
      <div class="section-head">
        <div>
          <h2>MV</h2>
          <p>视频内容。</p>
        </div>
      </div>
      <div class="track-list-app" id="video-results">
        <div class="empty-state"><strong>搜索后显示 MV</strong><span>视频点击后进入视频播放页。</span></div>
      </div>
    </section>
  </main>

  <audio id="search-audio" preload="metadata"></audio>
  <footer class="search-mini-player" id="search-mini-player" aria-label="播放控制">
    <button class="mini-track" id="mini-player-link" type="button" aria-label="进入播放页">
      <span class="mini-cover" id="mini-cover"><span data-icon="music"></span></span>
      <span class="mini-copy">
        <strong id="mini-title">请选择一首歌曲</strong>
        <span id="mini-artist">点击歌曲即可播放</span>
      </span>
    </button>
    <div class="mini-controls">
      <button class="mini-btn" id="mini-prev" type="button" aria-label="上一首"><span data-icon="previous"></span></button>
      <button class="mini-btn mini-play" id="mini-play" type="button" aria-label="播放或暂停"><span data-icon="play"></span></button>
      <button class="mini-btn" id="mini-next" type="button" aria-label="下一首"><span data-icon="next"></span></button>
    </div>
  </footer>

  <nav class="discover-tabbar" aria-label="底部导航">
    <a class="active" href="search.html" aria-label="发现"><span data-icon="search"></span><strong>发现</strong></a>
    <a href="index.html?view=favorites" aria-label="喜欢"><span data-icon="heart"></span><strong>喜欢</strong></a>
    <a href="index.html?view=mine" aria-label="我的"><span data-icon="user"></span><strong>我的</strong></a>
  </nav>

  <div class="action-scrim" id="search-action-scrim"></div>
  <aside class="action-sheet" id="search-action-sheet" aria-label="歌曲操作"></aside>

  <script src="videos/video_data.js"></script>
  <script src="site-config.js"></script>
  <script src="script.js"></script>
  <script src="js/search-app.js"></script>
</body>
</html>
