<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="丽江音悦台搜索 - 搜索纳西音乐、歌单、MV 视频和聚合音源">
  <meta name="robots" content="noindex">
  <title>丽江音悦台</title>
  <link rel="icon" href="./images/avatar.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="./images/avatar.jpg">
  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <link rel="stylesheet" href="css/search-app.css">
</head>
<body class="search-page">
  <main class="search-app" aria-label="搜索">
    <header class="search-topbar">
      <a class="search-brand" href="index.html" aria-label="返回丽江音悦台首页">
        <span class="search-brand-mark" data-icon="music"></span>
        <span class="search-brand-copy">
          <strong>丽江音悦台</strong>
          <span>搜索音乐、歌单和 MV</span>
        </span>
      </a>
      <nav class="search-nav" aria-label="页面导航">
        <a href="index.html" aria-label="首页"><span data-icon="home"></span><span>首页</span></a>
        <a class="active" href="search.html" aria-label="搜索"><span data-icon="search"></span><span>搜索</span></a>
        <a href="index.html?view=mine" aria-label="我的"><span data-icon="user"></span><span>我的</span></a>
        <a href="player.html" aria-label="播放页"><span data-icon="album"></span><span>播放</span></a>
      </nav>
    </header>

    <section class="search-panel">
      <p class="search-kicker"><strong>搜索</strong> 选择来源，查找歌曲、歌单和 MV 视频</p>
      <form class="search-form" id="search-form" action="search.html" method="GET" role="search">
        <div class="source-picker" id="source-picker">
          <button class="source-button" id="source-button" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span data-icon="radio"></span>
            <span id="source-label">聚合搜索</span>
            <span data-icon="chevronDown"></span>
          </button>
          <div class="source-menu" id="source-menu" role="listbox" aria-label="选择搜索来源">
            <button class="source-option active" type="button" data-source="aggregate">
              <span><strong>聚合搜索</strong><br><small>丽江曲库 + 已启用音源</small></span>
              <span data-icon="check"></span>
            </button>
            <button class="source-option" type="button" data-source="local">
              <span><strong>丽江曲库</strong><br><small>本站纳西音乐和视频</small></span>
              <span data-icon="database"></span>
            </button>
            <button class="source-option" type="button" data-source="joox">
              <span><strong>Joox</strong><br><small>海外华语/流行音乐源</small></span>
              <span data-icon="globe"></span>
            </button>
            <button class="source-option" type="button" data-source="netease">
              <span><strong>网易云</strong><br><small>小众音乐匹配较多</small></span>
              <span data-icon="music"></span>
            </button>
            <button class="source-option" type="button" data-source="kuwo">
              <span><strong>酷我</strong><br><small>曲库覆盖较广</small></span>
              <span data-icon="headphones"></span>
            </button>
            <button class="source-option" type="button" data-source="migu">
              <span><strong>Migu</strong><br><small>咪咕音乐来源</small></span>
              <span data-icon="radio"></span>
            </button>
            <button class="source-option" type="button" data-source="bilibili">
              <span><strong>B站</strong><br><small>用户上传音乐内容</small></span>
              <span data-icon="video"></span>
            </button>
            <button class="source-option" type="button" data-source="_netease">
              <span><strong>Netease</strong><br><small>网易云备用接口</small></span>
              <span data-icon="refresh"></span>
            </button>
          </div>
        </div>
        <label class="search-input-wrap" for="hero-search-input">
          <span data-icon="search"></span>
          <input type="search" id="hero-search-input" name="q" placeholder="搜索歌曲、歌手、歌单、MV..." aria-label="搜索音乐" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="search">
        </label>
        <button class="search-submit" id="search-btn" type="submit" aria-label="搜索">
          <span data-icon="search"></span>
        </button>
      </form>
      <div class="search-history" id="search-history" hidden>
        <span>搜索记录</span>
        <div class="history-list" id="history-list"></div>
        <button class="history-clear" id="history-clear" type="button">清空</button>
      </div>
    </section>

    <nav class="result-tabs" aria-label="搜索结果分类">
      <button class="result-tab active" type="button" data-filter="all"><span data-icon="grid"></span>全部</button>
      <button class="result-tab" type="button" data-filter="music"><span data-icon="music"></span>歌曲</button>
      <button class="result-tab" type="button" data-filter="playlists"><span data-icon="album"></span>歌单</button>
      <button class="result-tab" type="button" data-filter="video"><span data-icon="video"></span>MV</button>
    </nav>

    <div class="search-status" id="search-status">输入关键词搜索歌曲、歌手、MV，也可以直接进入歌单。</div>

    <section class="search-section" id="music-section">
      <div class="section-head">
        <div>
          <h2>歌曲</h2>
          <p>点击歌曲即可播放，右侧更多按钮可进入操作菜单。</p>
        </div>
        <a class="section-action" href="player.html">进入播放页</a>
      </div>
      <div class="track-list-app" id="music-results">
        <div class="empty-state"><strong>先搜索一首歌</strong><span>聚合搜索会同时查找丽江曲库和已启用音源。</span></div>
      </div>
    </section>

    <section class="search-section" id="playlist-section">
      <div class="section-head">
        <div>
          <h2>歌单</h2>
          <p>这里显示我的歌单、喜欢、最近播放和丽江曲库入口。</p>
        </div>
        <a class="section-action" href="index.html?view=mine">管理歌单</a>
      </div>
      <div class="playlist-grid-app" id="playlist-results"></div>
    </section>

    <section class="search-section" id="video-section">
      <div class="section-head">
        <div>
          <h2>MV 视频</h2>
          <p>来自丽江音悦台的视频内容。</p>
        </div>
      </div>
      <div class="track-list-app" id="video-results">
        <div class="empty-state"><strong>搜索后显示 MV</strong><span>视频点击后进入视频播放页。</span></div>
      </div>
    </section>
  </main>

  <audio id="search-audio" preload="metadata"></audio>
  <footer class="search-mini-player" id="search-mini-player" aria-label="搜索页播放控制">
    <button class="mini-track" id="mini-player-link" type="button" aria-label="进入播放页">
      <span class="mini-cover" id="mini-cover"><span data-icon="music"></span></span>
      <span class="mini-copy">
        <strong id="mini-title">请选择一首歌曲</strong>
        <span id="mini-artist">搜索后点击歌曲即可播放</span>
      </span>
    </button>
    <div class="mini-controls">
      <button class="mini-btn" id="mini-prev" type="button" aria-label="上一首"><span data-icon="previous"></span></button>
      <button class="mini-btn mini-play" id="mini-play" type="button" aria-label="播放或暂停"><span data-icon="play"></span></button>
      <button class="mini-btn" id="mini-next" type="button" aria-label="下一首"><span data-icon="next"></span></button>
    </div>
  </footer>
  <div class="action-scrim" id="search-action-scrim"></div>
  <aside class="action-sheet" id="search-action-sheet" aria-label="歌曲操作"></aside>

  <script src="videos/video_data.js"></script>
  <script src="site-config.js"></script>
  <script src="script.js"></script>
  <script src="js/search-app.js"></script>
</body>
</html>
