<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频链接测试 - 丽江音悦台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      padding: 20px;
      background: #f5f5f5;
    }
    .video-card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .status-badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .status-testing {
      background: #ffc107;
      color: #000;
    }
    .status-success {
      background: #28a745;
      color: white;
    }
    .status-error {
      background: #dc3545;
      color: white;
    }
    .video-url {
      font-size: 11px;
      color: #666;
      word-break: break-all;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-4">🔗 视频链接测试</h1>
    <p class="text-center text-muted mb-4">测试所有视频链接的有效性</p>
    
    <div class="text-center mb-4">
      <button class="btn btn-primary" onclick="testAllVideos()">
        <i class="fas fa-play me-2"></i>开始测试所有视频
      </button>
      <button class="btn btn-secondary ms-2" onclick="location.reload()">
        <i class="fas fa-redo me-2"></i>重新加载
      </button>
    </div>
    
    <div id="results"></div>
    
    <div class="text-center mt-4">
      <button class="btn btn-success" onclick="goToMainPage()">
        <i class="fas fa-home me-2"></i>返回主页
      </button>
    </div>
  </div>

  <script src="videos/video_data.js"></script>
  <script>
    var results = [];
    
    function createVideoCard(video, index) {
      return `
        <div class="video-card" id="video-${index}">
          <div class="d-flex align-items-center">
            <img src="${video.cover}" alt="${video.title}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin-right: 15px;">
            <div class="flex-grow-1">
              <h5 class="mb-1">${video.title}</h5>
              <p class="mb-1 text-muted">${video.artist}</p>
              <span class="status-badge status-testing" id="status-${index}">等待测试</span>
              <div class="video-url">${video.src.substring(0, 60)}...</div>
            </div>
          </div>
          <div class="mt-2">
            <button class="btn btn-sm btn-primary" onclick="testSingleVideo(${index})">
              <i class="fas fa-play me-1"></i>测试此视频
            </button>
            <button class="btn btn-sm btn-success" onclick="playVideo(${index})">
              <i class="fas fa-external-link-alt me-1"></i>播放
            </button>
          </div>
        </div>
      `;
    }
    
    function updateStatus(index, status, message) {
      var statusElement = document.getElementById('status-' + index);
      if (statusElement) {
        statusElement.className = 'status-badge status-' + status;
        statusElement.textContent = message;
      }
    }
    
    function testSingleVideo(index) {
      var video = videoData[index];
      updateStatus(index, 'testing', '测试中...');
      
      // 创建视频元素测试
      var videoElement = document.createElement('video');
      videoElement.preload = 'metadata';
      
      var source = document.createElement('source');
      source.src = video.src;
      source.type = 'video/mp4';
      videoElement.appendChild(source);
      
      var timeout = setTimeout(function() {
        updateStatus(index, 'error', '超时');
        results[index] = { success: false, message: '超时' };
      }, 10000);
      
      videoElement.addEventListener('loadedmetadata', function() {
        clearTimeout(timeout);
        updateStatus(index, 'success', '✓ 可用');
        results[index] = { success: true, message: '可用', duration: videoElement.duration };
        console.log('✅ 视频', index, video.title, '可用，时长:', videoElement.duration);
      });
      
      videoElement.addEventListener('error', function() {
        clearTimeout(timeout);
        updateStatus(index, 'error', '✗ 不可用');
        results[index] = { success: false, message: '不可用', error: videoElement.error };
        console.error('❌ 视频', index, video.title, '不可用，错误:', videoElement.error);
      });
    }
    
    function testAllVideos() {
      console.log('🧪 开始测试所有视频...');
      results = [];
      
      videoData.forEach(function(video, index) {
        setTimeout(function() {
          testSingleVideo(index);
        }, index * 500); // 间隔500ms测试
      });
      
      // 显示测试完成提示
      setTimeout(function() {
        var successCount = results.filter(function(r) { return r && r.success; }).length;
        var totalCount = videoData.length;
        alert('测试完成！\n成功: ' + successCount + '/' + totalCount + '\n失败: ' + (totalCount - successCount) + '/' + totalCount);
      }, videoData.length * 500 + 2000);
    }
    
    function playVideo(index) {
      var video = videoData[index];
      window.open('video-player.html?id=' + video.id, '_blank');
    }
    
    function goToMainPage() {
      window.location.href = 'index.html';
    }
    
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
      console.log('🔗 视频链接测试页面加载');
      
      var checkVideoData = setInterval(function() {
        if (typeof videoData !== 'undefined') {
          clearInterval(checkVideoData);
          console.log('✅ videoData 已加载，视频数量:', videoData.length);
          
          var resultsContainer = document.getElementById('results');
          resultsContainer.innerHTML = '<p class="text-center text-muted">找到 ' + videoData.length + ' 个视频</p>';
          
          videoData.forEach(function(video, index) {
            resultsContainer.innerHTML += createVideoCard(video, index);
          });
        }
      }, 100);
    });
  </script>
</body>
</html>
