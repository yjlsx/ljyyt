<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="丽江音悦台 - 热门排行榜">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://res.wx.qq.com" crossorigin>
  <link rel="preconnect" href="https://mmbiz.qpic.cn" crossorigin>
  <title>丽江音悦台</title>
  <link rel="icon" href="./images/avatar.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="./images/avatar.jpg">
  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="main.css">
  <style>
    body {
      padding-top: 70px;
      padding-bottom: 80px;
      background: url('./images/yyt.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      position: relative;
    }
    body::before { content: ''; position: fixed; inset: 0; background: linear-gradient(135deg, rgba(245,247,250,0.88), rgba(195,207,226,0.88)); z-index: -1; }
    body.dark-mode::before { background: rgba(0,0,0,0.5); }
    .navbar { background: linear-gradient(135deg, #667eea, #764ba2) !important; }
    .navbar-brand { display: flex; align-items: center; gap: 10px; }
    .brand-name { font-size: 1.2rem; font-weight: bold; color: white; }
    .brand-slogan { font-size: 0.7rem; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    .page-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px;
      padding: 35px 40px;
      color: white;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(102,126,234,0.3);
    }
    .page-header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
    .page-header p { opacity: 0.8; margin: 0; }

    .rank-section {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }
    body.dark-mode .rank-section { background: var(--dk-card); }
    .rank-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #333;
    }
    body.dark-mode .rank-title { color: var(--dk-text); }

    .rank-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 4px;
    }
    .rank-item:hover { background: rgba(102,126,234,0.08); transform: translateX(4px); }
    .rank-item:focus-visible {
      outline: 3px solid rgba(102,126,234,0.65);
      outline-offset: 2px;
      background: rgba(102,126,234,0.08);
    }
    .rank-item.active { background: rgba(102,126,234,0.12); }
    body.dark-mode .rank-item:hover { background: rgba(102,126,234,0.15); }

    .rank-num {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      flex-shrink: 0;
      margin-right: 12px;
    }
    .rank-num.gold { background: linear-gradient(135deg, #FFD700, #FFA500); color: white; }
    .rank-num.silver { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); color: white; }
    .rank-num.bronze { background: linear-gradient(135deg, #CD7F32, #B87333); color: white; }
    .rank-num.normal { background: #f0f0f0; color: #999; }
    body.dark-mode .rank-num.normal { background: var(--dk-surface2); color: var(--dk-muted); }

    .rank-cover {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .rank-info { flex: 1; min-width: 0; }
    .rank-song { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #333; }
    .rank-artist { font-size: 0.78rem; color: #999; }
    body.dark-mode .rank-song { color: var(--dk-text); }
    body.dark-mode .rank-artist { color: var(--dk-muted); }

    .rank-meta {
      flex-shrink: 0;
      text-align: right;
      margin-left: 10px;
    }
    .rank-count { font-size: 0.85rem; font-weight: 600; color: #667eea; }
    .rank-label { font-size: 0.65rem; color: #999; }
    body.dark-mode .rank-count { color: #8b9cf7; }

    .btn-back {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px;
      border-radius: 20px; font-size: 0.85rem; color: #667eea;
      border: 1px solid rgba(102,126,234,0.3); background: rgba(255,255,255,0.8);
      text-decoration: none; transition: all 0.2s; margin-bottom: 20px;
    }
    .btn-back:hover { background: #667eea; color: white; }
    body.dark-mode .btn-back { background: var(--dk-surface); color: var(--dk-text); border-color: var(--dk-border); }

    .empty-state { text-align: center; padding: 30px; color: #999; }
    .empty-state i { font-size: 2rem; display: block; margin-bottom: 10px; opacity: 0.4; }

    @media (max-width: 768px) {
      body {
        padding-bottom: 96px;
        background-attachment: scroll;
      }
      .container[style*="max-width:900px"] {
        padding-left: 12px;
        padding-right: 12px;
      }
      .page-header {
        padding: 24px 20px;
        margin-bottom: 20px;
      }
      .page-header h1 {
        font-size: 1.5rem;
      }
      .rank-section {
        padding: 18px;
      }
    }

    @media (max-width: 576px) {
      .rank-item {
        padding: 10px;
      }
      .rank-num {
        width: 28px;
        height: 28px;
        margin-right: 10px;
        font-size: 0.82rem;
      }
      .rank-cover {
        width: 40px;
        height: 40px;
        margin-right: 10px;
      }
      .rank-song {
        font-size: 0.86rem;
      }
      .rank-artist,
      .rank-label {
        font-size: 0.72rem;
      }
      .rank-count {
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .rank-item:hover {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 (由 components.js 注入) -->
  <div id="navbar-placeholder"></div>

  <div class="container" style="max-width:900px;">
    <div class="page-header">
      <h1><i class="fas fa-trophy me-2"></i>排行榜</h1>
      <p>热门歌曲 · 最爱收藏 · 最近播放</p>
    </div>

    <!-- 热门播放 -->
    <div class="rank-section">
      <h3 class="rank-title"><i class="fas fa-fire" style="color:#ff6b6b"></i> 热门播放</h3>
      <div id="hot-list"></div>
    </div>

    <!-- 收藏最多 -->
    <div class="rank-section">
      <h3 class="rank-title"><i class="fas fa-heart" style="color:#ff6b6b"></i> 收藏最多</h3>
      <div id="fav-list"></div>
    </div>

    <!-- 最近播放 -->
    <div class="rank-section">
      <h3 class="rank-title"><i class="fas fa-history" style="color:#667eea"></i> 最近播放</h3>
      <div id="recent-list"></div>
    </div>
  </div>

  <!-- 底部播放器 (由 components.js 注入) -->
  <div id="player-placeholder"></div>

  <!-- 组件注入必须最先加载 -->
  <script src="components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="videos/video_data.js"></script>
  <script src="site-config.js"></script>
  <script src="script.js"></script>
  <script src="player_state.js"></script>
  <script src="player_enhanced.js"></script>
  <script>
    function formatTime(s) {
      if (!s) return '0:00';
      var m = Math.floor(s/60), sec = Math.floor(s%60);
      return m + ':' + (sec<10?'0':'') + sec;
    }
    function getRankClass(i) {
      if (i === 0) return 'gold';
      if (i === 1) return 'silver';
      if (i === 2) return 'bronze';
      return 'normal';
    }
    function readRankingStorageValue(key, fallback) {
      try {
        var value = localStorage.getItem(key);
        return value == null ? fallback : value;
      } catch (error) {
        return fallback;
      }
    }
    function readRankingStorageJson(key, fallback) {
      try {
        var value = JSON.parse(readRankingStorageValue(key, 'null'));
        return value == null ? fallback : value;
      } catch (error) {
        return fallback;
      }
    }
    function normalizeRankingList(value) {
      return Array.isArray(value) ? value : [];
    }
    function readRankingList(primaryKey, legacyKey) {
      var primary = normalizeRankingList(readRankingStorageJson(primaryKey, []));
      if (primary.length) return primary;
      return normalizeRankingList(readRankingStorageJson(legacyKey, []));
    }
    function findRankingTrack(item) {
      var isObject = item && typeof item === 'object' && !Array.isArray(item);
      var id = isObject ? item.id : item;
      if (id != null) {
        var matched = musicData.find(function(t) { return String(t.id) === String(id); });
        if (matched) return matched;
      }
      return isObject ? item : null;
    }
    function normalizeRankingTracks(list) {
      return normalizeRankingList(list).map(findRankingTrack).filter(Boolean);
    }
    function setRankingImage(image, url) {
      if (!image) return;
      var value = String(url || '').trim().replace(/&amp;/g, '&');
      image.src = /^https?:\/\//i.test(value) || value.indexOf('//') === 0 || value.indexOf('./') === 0 || value.indexOf('/') === 0
        ? value
        : './images/avatar.jpg';
      image.referrerPolicy = 'no-referrer';
      image.loading = 'lazy';
    }
    function makeLegacyActionCard(element, label, handler) {
      if (!element || typeof handler !== 'function') return;
      if (typeof element.setAttribute === 'function') {
        element.setAttribute('role', 'button');
        element.setAttribute('aria-label', label);
      } else {
        element.role = 'button';
        element.ariaLabel = label;
      }
      element.tabIndex = 0;
      if (typeof element.addEventListener !== 'function') return;
      element.addEventListener('click', handler);
      element.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ' || event.key === 'Spacebar') {
          event.preventDefault();
          handler(event);
        }
      });
    }

    // 深色模式
    if (readRankingStorageValue('ljyyt_dark_mode', 'false') === 'true') document.body.classList.add('dark-mode');

    // 加载数据
    var playCounts = {};
    var favorites = [];
    var playHistory = [];
    playCounts = readRankingStorageJson('ljyyt_play_count', {});
    if (!playCounts || typeof playCounts !== 'object' || Array.isArray(playCounts)) playCounts = {};
    favorites = readRankingList('ljyyt_otter_favorites', 'ljyyt_favorites');
    playHistory = readRankingList('ljyyt_otter_history', 'ljyyt_play_history');

    function renderRank(containerId, tracks, type) {
      var container = document.getElementById(containerId);
      if (!tracks || tracks.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无数据</p></div>';
        return;
      }
      container.innerHTML = '';
      tracks.slice(0, 10).forEach(function(item, i) {
        var track = item.track || item;
        var count = item.count || 0;
        var idx = musicData.findIndex(function(t) { return t.id === track.id; });
        var div = document.createElement('div');
        div.className = 'rank-item';
        var rankNum = document.createElement('div');
        rankNum.className = 'rank-num ' + getRankClass(i);
        rankNum.textContent = i + 1;
        var cover = document.createElement('img');
        cover.className = 'rank-cover';
        setRankingImage(cover, track.cover);
        var info = document.createElement('div');
        info.className = 'rank-info';
        var song = document.createElement('div');
        song.className = 'rank-song';
        song.textContent = track.title || '未知歌曲';
        var artist = document.createElement('div');
        artist.className = 'rank-artist';
        artist.textContent = track.artist || '未知歌手';
        var meta = document.createElement('div');
        meta.className = 'rank-meta';
        var countValue = document.createElement('div');
        countValue.className = 'rank-count';
        var label = document.createElement('div');
        label.className = 'rank-label';
        if (type === 'count') {
          countValue.textContent = String(count);
          label.textContent = '次播放';
          meta.appendChild(countValue);
          meta.appendChild(label);
        } else if (type === 'fav') {
          var heart = document.createElement('i');
          heart.className = 'fas fa-heart';
          heart.style.cssText = 'color:#ff6b6b;font-size:0.75rem';
          label.textContent = '已收藏';
          countValue.appendChild(heart);
          meta.appendChild(countValue);
          meta.appendChild(label);
        } else {
          var duration = document.createElement('div');
          duration.className = 'rank-count';
          duration.style.cssText = 'font-size:0.75rem;color:#999';
          duration.textContent = formatTime(track.duration);
          meta.appendChild(duration);
        }
        info.appendChild(song);
        info.appendChild(artist);
        div.appendChild(rankNum);
        div.appendChild(cover);
        div.appendChild(info);
        div.appendChild(meta);
        makeLegacyActionCard(div, '播放歌曲 ' + (track.title || '未知歌曲') + ' - ' + (track.artist || '未知歌手'), function() {
          if (idx !== -1) {
            currentTrackIndex = idx;
            loadTrack(idx);
            playMusic();
          }
        });
        container.appendChild(div);
      });
    }

    // 热门播放
    var hotSongs = [];
    Object.keys(playCounts).forEach(function(id) {
      var track = musicData.find(function(t) { return t.id == id; });
      if (track) hotSongs.push({ track: track, count: playCounts[id] });
    });
    hotSongs.sort(function(a, b) { return b.count - a.count; });
    renderRank('hot-list', hotSongs, 'count');

    // 收藏最多
    var favSongs = normalizeRankingTracks(favorites);
    renderRank('fav-list', favSongs, 'fav');

    // 最近播放
    var recentSongs = normalizeRankingTracks(playHistory);
    renderRank('recent-list', recentSongs, 'recent');
  </script>
</body>
</html>
