<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>移动端播放器测试</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style_mobile.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      padding-bottom: 100px;
    }
    
    .test-container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .test-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .test-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 16px;
      text-align: center;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    
    .status-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 0.9rem;
    }
    
    .status-success {
      background: #d4edda;
      color: #155724;
    }
    
    .status-text {
      flex: 1;
      font-weight: 500;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="test-card">
      <h1 class="test-title">🎵 移动端播放器测试</h1>
      
      <h5 style="margin-bottom: 16px; color: #333;">修复状态检查</h5>
      
      <div class="status-item">
        <div class="status-icon status-success">
          <i class="fas fa-check"></i>
        </div>
        <div class="status-text">导航栏颜色已修复为紫色渐变</div>
      </div>
      
      <div class="status-item">
        <div class="status-icon status-success">
          <i class="fas fa-check"></i>
        </div>
        <div class="status-text">底部播放器歌名现在可以显示</div>
      </div>
      
      <div class="status-item">
        <div class="status-icon status-success">
          <i class="fas fa-check"></i>
        </div>
        <div class="status-text">播放控制按钮已改为水平排列</div>
      </div>
      
      <div class="status-item">
        <div class="status-icon status-success">
          <i class="fas fa-check"></i>
        </div>
        <div class="status-text">底部播放器背景色已修复</div>
      </div>
      
      <div class="status-item">
        <div class="status-icon status-success">
          <i class="fas fa-check"></i>
        </div>
        <div class="status-text">进度条布局已优化</div>
      </div>
    </div>
    
    <div class="test-card">
      <h5 style="margin-bottom: 16px; color: #333;">播放器布局预览</h5>
      <p style="color: #666; font-size: 0.9rem; margin-bottom: 16px;">
        请查看页面底部的播放器，应该看到：
      </p>
      <ul style="color: #666; font-size: 0.9rem; padding-left: 20px;">
        <li>歌名和歌手信息在左侧显示</li>
        <li>播放控制按钮水平排列</li>
        <li>进度条在中间显示</li>
        <li>背景色为紫色渐变</li>
      </ul>
    </div>
    
    <button class="btn btn-primary w-100 mb-3" onclick="window.location.href='index.html'" style="padding: 16px; font-size: 1.1rem;">
      <i class="fas fa-home"></i> 返回主页
    </button>
  </div>
  
  <!-- 模拟底部播放器 -->
  <div id="bottom-player" class="bottom-player fixed-bottom text-white shadow-lg">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between">
        <!-- 当前播放信息 -->
        <div class="current-track-info d-flex align-items-center flex-grow-1 me-3">
          <img id="current-cover" src="./images/avatar.jpg" alt="专辑封面" class="rounded me-2" width="50" height="50">
          <div>
            <h6 id="current-title" class="mb-0">测试歌曲</h6>
            <small id="current-artist" class="text-white-50">测试歌手</small>
          </div>
        </div>
        
        <!-- 播放控制 -->
        <div class="player-controls d-flex align-items-center me-3">
          <button id="prev-btn" class="btn btn-outline-light btn-sm me-2"><i class="fas fa-step-backward"></i></button>
          <button id="play-btn" class="btn btn-light rounded-circle" style="width: 40px; height: 40px;">
            <i class="fas fa-play text-primary"></i>
          </button>
          <button id="next-btn" class="btn btn-outline-light btn-sm ms-2"><i class="fas fa-step-forward"></i></button>
        </div>
        
        <!-- 进度条和时间 -->
        <div class="progress-container flex-grow-1 me-3">
          <div class="d-flex align-items-center">
            <span id="current-time" class="text-white-50 me-2" style="font-size: 0.8rem;">0:00</span>
            <div id="progress-container" class="progress flex-grow-1" style="height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; cursor: pointer;">
              <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 30%; background: #fff; height: 100%; transition: width 0.1s linear;"></div>
            </div>
            <span id="total-time" class="text-white-50 ms-2" style="font-size: 0.8rem;">3:45</span>
          </div>
        </div>
        
        <!-- 音量控制 -->
        <div class="volume-control d-flex align-items-center">
          <i class="fas fa-volume-up text-white-50 me-2"></i>
          <input type="range" id="volume-slider" class="form-range" min="0" max="1" step="0.01" value="0.7" style="width: 80px;">
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // 模拟播放器交互
    let isPlaying = false;
    const playBtn = document.getElementById('play-btn');
    const playIcon = playBtn.querySelector('i');
    
    playBtn.addEventListener('click', function() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');
      } else {
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
      }
    });
  </script>
</body>
</html>
