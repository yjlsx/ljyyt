<body>
  <!-- 导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="./images/avatar.jpg" alt="丽江音悦台" width="40" height="40" class="rounded-circle me-2">
          <div class="d-flex flex-column">
            <span class="brand-name">丽江音悦台</span>
            <span class="brand-slogan">传承纳西文化，分享民族音乐之美</span>
          </div>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#" onclick="scrollToTop(); return false;">首页</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#about">关于我们</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">联系我们</a>
            </li>
          </ul>
          <!-- 搜索栏 -->
          <form class="d-flex" id="search-form">
            <input class="form-control me-2" type="search" id="search-input" placeholder="搜索音乐..." aria-label="搜索">
            <button class="btn btn-outline-light" type="submit">
              <i class="fas fa-search"></i>
            </button>
          </form>
        </div>
      </div>
    </nav>


  <!-- 艺术标语 -->
  <div class="slogan-container">
    <div class="slogan-wrapper">
      <div class="slogan-line"></div>
      <div class="slogan-text">弘扬真善美，传播好声音</div>
      <div class="slogan-line"></div>
    </div>
  </div>

  <!-- 音乐和视频标签页 -->
  <section class="content-section py-5">
    <div class="container">
      <!-- 标签导航 -->
      <ul class="nav nav-tabs justify-content-center mb-4" id="contentTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="music-tab" data-bs-toggle="tab" data-bs-target="#music-content" type="button" role="tab">
            <i class="fas fa-music me-2"></i>音乐
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="video-tab" data-bs-toggle="tab" data-bs-target="#video-content" type="button" role="tab">
            <i class="fas fa-video me-2"></i>视频
          </button>
        </li>
      </ul>
      
      <!-- 标签内容 -->
      <div class="tab-content" id="contentTabsContent">
        <!-- 音乐内容 -->
        <div class="tab-pane fade show active" id="music-content" role="tabpanel">
          <div class="row" id="music-list">
            <!-- 音乐列表将通过JavaScript动态生成 -->
          </div>
          <!-- 音乐分页控制器 -->
          <div id="music-pagination" class="pagination-container d-flex justify-content-center align-items-center mt-5 flex-wrap gap-2">
            <!-- 分页按钮将通过JS生成 -->
          </div>
        </div>
        
        <!-- 视频内容 -->
        <div class="tab-pane fade" id="video-content" role="tabpanel">
          <div class="row" id="video-list">
            <!-- 视频列表将通过JavaScript动态生成 -->
          </div>
          <!-- 视频分页控制器 -->
          <div id="video-pagination" class="pagination-container d-flex justify-content-center align-items-center mt-5 flex-wrap gap-2">
            <!-- 分页按钮将通过JS生成 -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 关于我们上面 -->
  <section id="about" class="about-section bg-light py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-10 text-center">
          <h3>关于我们</h3>
          <p>丽江音悦台致力于传承和推广纳西族传统音乐文化，通过现代技术手段让更多人了解和欣赏纳西族独特的音乐艺术。</p>
          <p>我们的使命是保护和传播纳西族音乐遗产，同时鼓励现代创作，让古老的音乐文化在新时代焕发光彩。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 联系我们 -->
  <section id="contact" class="contact-section py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
          <div class="contact-card-minimal">
            <div class="row g-0">
              <!-- 左侧艺术装饰 -->
              <div class="col-md-5 d-none d-md-flex align-items-center justify-content-center border-end border-light">
                <div class="text-center p-5">
                  <div class="mb-4">
                    <i class="fas fa-paper-plane fa-3x" style="color: #d35400; opacity: 0.6;"></i>
                  </div>
                  <h4 class="fw-light mb-3" style="letter-spacing: 4px; color: #333;">写给丽江</h4>
                  <p class="small text-muted" style="line-height: 2;">一曲纳西韵<br>万种民族情<br>期待您的声音</p>
                </div>
              </div>
              
              <!-- 右侧表单 -->
              <div class="col-md-7">
                <div class="p-4 p-md-5">
                  <div class="mb-5">
                    <h3 class="fw-bold" style="letter-spacing: 2px;">联系我们</h3>
                    <div style="width: 30px; height: 2px; background: #d35400;"></div>
                  </div>
                  
                  <form id="contactForm">
                    <div class="mb-4">
                      <label class="form-label small text-uppercase fw-bold opacity-50">您的称呼</label>
                      <input type="text" class="form-control minimal-input" id="nickname" name="nickname" required>
                    </div>
                    
                    <div class="mb-4">
                      <label class="form-label small text-uppercase fw-bold opacity-50">您的邮箱</label>
                      <input type="email" class="form-control minimal-input" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-5">
                      <label class="form-label small text-uppercase fw-bold opacity-50">留言内容</label>
                      <textarea class="form-control minimal-input" id="message" name="message" rows="3" required></textarea>
                    </div>
                    
                    <div class="text-end">
                      <button type="submit" class="btn btn-minimal">
                        发送信息 <i class="fas fa-long-arrow-alt-right ms-2"></i>
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 邮件发送所需的脚本 -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function(){
      emailjs.init("ojiQsRL4dJSKmRPkx");
    })();

  <!-- 向上火箭按钮 -->
  <button id="scrollToTopBtn" class="scroll-to-top" onclick="scrollToTop()">
    <i class="fas fa-rocket"></i>
  </button>
  
  <script>
    // 控制台输出函数
    function log(message) {
      console.log(message);
    }
    
    // 滚动到顶部函数
    function scrollToTop() {
      log('scrollToTop 被调用');
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
      
      // 添加火箭发射动画效果
      var btn = document.getElementById('scrollToTopBtn');
      if (btn) {
        // 简单的向上移动动画
        btn.style.transform = 'translateY(-20px)';
        setTimeout(function() {
          btn.style.transform = '';
        }, 300);
      }
    }
    
    // 显示/隐藏火箭按钮
    function updateRocketButton() {
      var scrollToTopBtn = document.getElementById('scrollToTopBtn');
      if (scrollToTopBtn) {
        var scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
        log('当前滚动位置：' + scrollPosition);
        
        // 只有滚动超过300px才显示
        if (scrollPosition > 300) {
          scrollToTopBtn.classList.add('show');
          log('火箭按钮已显示');
        } else {
          scrollToTopBtn.classList.remove('show');
          log('火箭按钮已隐藏');
        }
      }
    }
    
    // 页面加载完成后检查
    document.addEventListener('DOMContentLoaded', function() {
      log('DOM已加载');
      
      var scrollToTopBtn = document.getElementById('scrollToTopBtn');
      if (scrollToTopBtn) {
        log('火箭按钮元素已找到');
        
        // 检查按钮样式
        var computedStyle = window.getComputedStyle(scrollToTopBtn);
        if (computedStyle.position === 'fixed') {
          log('火箭按钮样式正确');
        } else {
          log('火箭按钮样式错误：position = ' + computedStyle.position);
        }
        
        // 初始状态：隐藏
        scrollToTopBtn.style.opacity = '0';
        scrollToTopBtn.style.visibility = 'hidden';
        log('火箭按钮初始状态：隐藏');
        
        // 检查滚动位置，如果超过300px则显示
        var scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollPosition > 300) {
          scrollToTopBtn.classList.add('show');
          log('页面加载时火箭按钮已显示');
        }
      } else {
        log('错误：找不到火箭按钮元素');
      }
      
      // 添加滚动事件监听器
      window.addEventListener('scroll', updateRocketButton);
      log('滚动事件监听器已添加');
      
      // 为首页链接添加点击事件
      var homeLink = document.querySelector('.nav-link.active[href="#"]');
      if (homeLink) {
        homeLink.addEventListener('click', function(e) {
          e.preventDefault();
          scrollToTop();
        });
      }
      
      // 为头像添加点击事件
      var avatar = document.querySelector('.navbar-brand img');
      if (avatar) {
        avatar.style.cursor = 'pointer';
        avatar.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          scrollToTop();
        });
      }
      
      log('火箭按钮功能已初始化');
      
      // 联系我们表单处理
      const contactForm = document.getElementById('contactForm');
      if (contactForm) {
        contactForm.addEventListener('submit', function(e) {
          e.preventDefault(); // 阻止默认提交行为
          
          // 获取表单数据
          const nickname = document.getElementById('nickname').value;
          const email = document.getElementById('email').value;
          const message = document.getElementById('message').value;
          
          // 验证必填字段
          if (!nickname || !email || !message) {
            alert('请填写所有必填字段！');
            return;
          }
          
          // 验证邮箱格式
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            alert('请输入有效的邮箱地址！');
            return;
          }
          
          // 发送邮件
          sendContactEmail(nickname, email, message);
        });
      }
    });
    
    // 发送联系邮件函数
    function sendContactEmail(nickname, email, message) {
      // 显示发送中提示
      const submitBtn = document.querySelector('#contactForm .btn-primary');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = '发送中...';
      submitBtn.disabled = true;
      
      // 邮件模板参数
      const templateParams = {
        from_name: nickname,
        from_email: email,
        message: message,
        to_email: "2509904241@qq.com", // 您的QQ邮箱
        subject: `丽江音悦台 - 来自${nickname}的联系`
      };
      
      // 使用EmailJS发送邮件
      emailjs.send('service_aqocomv', 'template_c848a1t', templateParams)
        .then(function(response) {
          console.log('SUCCESS!', response.status, response.text);
          alert('您的消息已成功发送！我们会尽快回复您。');
          // 重置表单
          document.getElementById('contactForm').reset();
          // 恢复按钮状态
          const submitBtn = document.querySelector('#contactForm .btn-primary');
          submitBtn.textContent = '发送';
          submitBtn.disabled = false;
        }, function(error) {
          console.log('FAILED...', error);
          alert('发送失败，请稍后重试。');
          // 恢复按钮状态
          const submitBtn = document.querySelector('#contactForm .btn-primary');
          submitBtn.textContent = '发送';
          submitBtn.disabled = false;
        });
    }
  </script>
