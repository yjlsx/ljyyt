  <!-- 向上火箭按钮 -->
  <button id="scrollToTopBtn" class="scroll-to-top" type="button" aria-label="回到顶部">
    <i class="fas fa-rocket"></i>
  </button>
  
  <script>
    // 控制台输出函数
    function log(message) {
      console.log(message);
    }
    
    // 滚动到顶部函数
    function scrollToTop() {
      log('scrollToTop 被调用');
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
      
      // 添加火箭发射动画效果
      var btn = document.getElementById('scrollToTopBtn');
      if (btn) {
        // 简单的向上移动动画
        btn.style.transform = 'translateY(-20px)';
        setTimeout(function() {
          btn.style.transform = '';
        }, 300);
      }
    }
    
    // 显示/隐藏火箭按钮
    function updateRocketButton() {
      var scrollToTopBtn = document.getElementById('scrollToTopBtn');
      if (scrollToTopBtn) {
        var scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
        log('当前滚动位置：' + scrollPosition);
        
        // 只有滚动超过300px才显示
        if (scrollPosition > 300) {
          scrollToTopBtn.classList.add('show');
          log('火箭按钮已显示');
        } else {
          scrollToTopBtn.classList.remove('show');
          log('火箭按钮已隐藏');
        }
      }
    }
    
    // 页面加载完成后检查
    document.addEventListener('DOMContentLoaded', function() {
      log('DOM已加载');
      
      var scrollToTopBtn = document.getElementById('scrollToTopBtn');
      if (scrollToTopBtn) {
        log('火箭按钮元素已找到');
        
        // 检查按钮样式
        var computedStyle = window.getComputedStyle(scrollToTopBtn);
        if (computedStyle.position === 'fixed') {
          log('火箭按钮样式正确');
        } else {
          log('火箭按钮样式错误：position = ' + computedStyle.position);
        }
        
        // 初始状态：隐藏
        scrollToTopBtn.style.opacity = '0';
        scrollToTopBtn.style.visibility = 'hidden';
        log('火箭按钮初始状态：隐藏');
        
        // 检查滚动位置，如果超过300px则显示
        var scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollPosition > 300) {
          scrollToTopBtn.classList.add('show');
          log('页面加载时火箭按钮已显示');
        }
      } else {
        log('错误：找不到火箭按钮元素');
      }
      
      // 添加滚动事件监听器
      window.addEventListener('scroll', updateRocketButton);
      log('滚动事件监听器已添加');
      
      // 为首页链接添加点击事件
      var homeLink = document.getElementById('home-link');
      if (homeLink) {
        homeLink.addEventListener('click', function(e) {
          e.preventDefault();
          scrollToTop();
        });
      }

      if (scrollToTopBtn) {
        scrollToTopBtn.addEventListener('click', scrollToTop);
      }
      
      // 为头像添加点击事件
      var avatar = document.querySelector('.navbar-brand img');
      if (avatar) {
        avatar.style.cursor = 'pointer';
        avatar.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          scrollToTop();
        });
      }
      
      log('火箭按钮功能已初始化');
      
      // 联系我们表单处理
      const contactForm = document.getElementById('contactForm');
      if (contactForm) {
        contactForm.addEventListener('submit', function(e) {
          e.preventDefault(); // 阻止默认提交行为
          
          // 获取表单数据
          const nickname = document.getElementById('nickname').value.trim();
          const email = document.getElementById('email').value.trim();
          const message = document.getElementById('message').value.trim();
          
          // 验证必填字段
          if (!nickname || !email || !message) {
            alert('请填写所有必填字段！');
            return;
          }
          
          // 验证邮箱格式
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            alert('请输入有效的邮箱地址！');
            return;
          }
          
          // 发送邮件
          sendContactEmail(nickname, email, message);
        });
      }
    });
    
    // 显示提示消息函数
    function showToast(message, type = 'success') {
      // 创建提示元素
      const toast = document.createElement('div');
      toast.className = `contact-toast toast-${type}`;
      toast.innerHTML = `
        <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
        ${message}
      `;
      
      // 添加到页面
      document.body.appendChild(toast);
      
      // 显示动画
      setTimeout(() => {
        toast.classList.add('show');
      }, 100);
      
      // 3秒后自动消失
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          document.body.removeChild(toast);
        }, 300);
      }, 3000);
    }
    
    // 发送联系邮件函数
    function sendContactEmail(nickname, email, message) {
      // 显示发送中提示
      const submitBtn = document.querySelector('#contactForm button[type="submit"]');
      if (!submitBtn) {
        console.error('找不到提交按钮');
        return;
      }
      const originalText = submitBtn.textContent;
      submitBtn.textContent = '发送中...';
      submitBtn.disabled = true;
      
      if (typeof emailjs === 'undefined') {
        showToast('邮件服务暂时不可用，请稍后重试。', 'error');
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
        return;
      }

      // 邮件模板参数
      const templateParams = {
        from_name: nickname,
        from_email: email,
        message: message,
        to_email: "2509904241@qq.com", // 您的QQ邮箱
        subject: `丽江音悦台 - 来自${nickname}的联系`
      };
      
      // 使用EmailJS发送邮件
      emailjs.send('service_aqocomv', 'template_c848a1t', templateParams)
        .then(function(response) {
          console.log('SUCCESS!', response.status, response.text);
          showToast('✨ 留言发送成功！我们会尽快回复您。', 'success');
          // 重置表单
          document.getElementById('contactForm').reset();
          // 恢复按钮状态
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }, function(error) {
          console.log('FAILED...', error);
          showToast('❌ 发送失败，请稍后重试。', 'error');
          // 恢复按钮状态
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        });
    }
  </script>
